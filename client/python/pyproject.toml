[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flaredb-client"
version = "0.1.0"
description = "Official Python client wrapper for FlareDB database engines"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flaredb_client*"]
