[package]
name = "picomq-connector-doris-sink"
version.workspace = true
description = "PicoMQ is the persistent message streaming platform written in Rust, supporting QUIC, TCP and HTTP transport protocols, capable of processing millions of messages per second."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "picomq_connector_doris_sink"
crate-type = ["cdylib", "lib"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
humantime = { workspace = true }
picomq-connector-sdk = { path = "../../sdk" }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
missing_safety_doc = "allow"
