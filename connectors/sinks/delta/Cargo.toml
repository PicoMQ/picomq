[package]
name = "picomq-connector-delta-sink"
version.workspace = true
description = "PicoMQ Delta Lake sink connector for appending stream messages to Delta tables on local, S3, Azure, or GCS storage."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "picomq_connector_delta_sink"
crate-type = ["cdylib", "lib"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
deltalake = { workspace = true }
picomq-connector-sdk = { path = "../../sdk" }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
missing_safety_doc = "allow"
