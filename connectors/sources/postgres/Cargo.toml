[package]
name = "picomq-connector-postgres-source"
version.workspace = true
description = "PicoMQ PostgreSQL source connector supporting CDC and table polling for message streaming platform"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "picomq_connector_postgres_source"
crate-type = ["cdylib", "lib"]

[features]
cdc_pg_replicate = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
humantime = { workspace = true }
picomq-connector-sdk = { path = "../../sdk" }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
sqlx = { workspace = true, features = ["rust_decimal", "uuid"] }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
missing_safety_doc = "allow"
