simd-json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
toml = { workspace = true }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
missing_safety_doc = "allow"
