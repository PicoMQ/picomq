[package]
name = "pico-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PicoMQ HTTP frontends: the Pico protocol and the Durable Streams protocol over pico-server"
repository.workspace = true

[dependencies]
pico-protocol = { workspace = true }
pico-server = { workspace = true }
pico-common = { workspace = true }
pico-auth = { workspace = true }
pico-metadata = { workspace = true }
s3stream = { workspace = true }
axum = { workspace = true, features = ["http2"] }
socket2 = { workspace = true }
bytes = { workspace = true }
# `net` for the listeners in `serve` (axum enables it transitively; declared so
# this crate does not depend on feature unification).
tokio = { workspace = true, features = ["net"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
humantime = { workspace = true }
rust-embed = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
reqwest = { workspace = true }
durable-streams = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
