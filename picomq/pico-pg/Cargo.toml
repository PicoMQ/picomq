[workspace]

[package]
name = "picomq-pg"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "pico"
crate-type = ["cdylib", "lib"]
test = false
doctest = false

[[bin]]
name = "pgrx_embed_pico"
path = "src/bin/embed.rs"
test = false

[features]
default = ["pg17"]
pg16 = ["pgrx/pg16"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.16.1"
picomq-runtime = { path = "../pico-runtime" }
s3stream = { git = "https://github.com/PicoMQ/s3stream", tag = "v0.1.0" }
libc = "0.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
