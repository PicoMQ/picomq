[package]
name = "picomq-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PicoMQ HTTP frontends: the Pico protocol and the Durable Streams protocol over picomq-server"
repository.workspace = true

[dependencies]
picomq-protocol = { workspace = true }
picomq-server = { workspace = true }
picomq-common = { workspace = true }
picomq-auth = { workspace = true }
picomq-metadata = { workspace = true }
picomq-listener = { workspace = true }
s3stream = { workspace = true }
axum = { workspace = true, features = ["http2"] }
bytes = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
humantime = { workspace = true }
picomq-metrics = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "stream"] }
rust-embed = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
flate2 = { workspace = true }
tokio = { workspace = true, features = ["net"] }
kafka-protocol = { workspace = true }
picomq-listener = { workspace = true, features = ["testing"] }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["http2", "stream"] }
durable-streams = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
