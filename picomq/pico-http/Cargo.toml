[package]
name = "picomq-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PicoMQ HTTP frontends: the Pico protocol and the Durable Streams protocol over picomq-server"
repository.workspace = true

[dependencies]
picomq-protocol = { workspace = true }
picomq-server = { workspace = true }
picomq-common = { workspace = true }
picomq-auth = { workspace = true }
picomq-metadata = { workspace = true }
s3stream = { workspace = true }
axum = { workspace = true, features = ["http2"] }
socket2 = { workspace = true }
bytes = { workspace = true }
# `net` for the listeners in `serve` (axum enables it transitively; declared so
# this crate does not depend on feature unification).
tokio = { workspace = true, features = ["net"] }
tokio-stream = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
humantime = { workspace = true }
rust-embed = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
reqwest = { workspace = true }
durable-streams = { workspace = true }
tempfile = { workspace = true }
picomq-schema = { workspace = true }
object_store = { workspace = true }

[lints]
workspace = true
