<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" role="img" aria-label="Many consumers replay one PicoMQ stream. PicoMQ reads committed objects through Nestor, which fetches each block from RustFS once. The WAL goes to RustFS directly.">
