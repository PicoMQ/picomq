    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0.5 L7.5 4 L0 7.5 Z" fill="#737373"/>
    </marker>
  </defs>
  <rect x="16" y="24" width="120" height="40" rx="6" fill="#ece7db" stroke="#d4d4d4"/>
  <text x="76" y="49" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#171717">consumer 1</text>
  <rect x="16" y="90" width="120" height="40" rx="6" fill="#ece7db" stroke="#d4d4d4"/>
  <text x="76" y="115" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#171717">consumer 2</text>
  <rect x="16" y="156" width="120" height="40" rx="6" fill="#ece7db" stroke="#d4d4d4"/>
  <text x="76" y="181" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#171717">consumer 32</text>
  <rect x="216" y="82" width="130" height="56" rx="6" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="281" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">PicoMQ</text>
  <text x="281" y="124" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#737373">/replay</text>
  <rect x="410" y="82" width="130" height="56" rx="6" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="475" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">Nestor</text>
  <text x="475" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">block cache</text>
  <rect x="584" y="82" width="120" height="56" rx="6" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="644" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">RustFS</text>
  <text x="644" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">origin</text>
  <path d="M136 44 L208 100" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M136 110 L208 110" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M136 176 L208 120" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M346 110 L402 110" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M540 110 L576 110" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M281 138 L281 190 L644 190 L644 146" fill="none" stroke="#737373" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
