services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: pico
      POSTGRES_PASSWORD: pico
      POSTGRES_DB: picomq
    volumes:
      - pg-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pico -d picomq"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: picomq
      RUSTFS_SECRET_KEY: picomqpicomq
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  createbucket:
    image: amazon/aws-cli:2.36.28
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: picomq
      AWS_SECRET_ACCESS_KEY: picomqpicomq
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://rustfs:9000 s3 mb s3://picomq 2>/dev/null || true
        aws --endpoint-url http://rustfs:9000 s3 mb s3://lake 2>/dev/null || true
        aws --endpoint-url http://rustfs:9000 s3 ls s3://picomq >/dev/null
        aws --endpoint-url http://rustfs:9000 s3 ls s3://lake >/dev/null
    restart: "no"

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      createbucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: picomq
      AWS_SECRET_ACCESS_KEY: picomqpicomq
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://lake/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: picomq
      CATALOG_S3_SECRET__ACCESS__KEY: picomqpicomq
    ports:
      - "8181:8181"
    restart: unless-stopped

  createtable:
    image: curlimages/curl:8.16.0
    depends_on:
      iceberg-rest:
        condition: service_started
    volumes:
      - ./sql/namespace.json:/tmp/namespace.json:ro
      - ./sql/table.json:/tmp/table.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        while [ "$$i" -lt 60 ]; do
          if curl -fsS http://iceberg-rest:8181/v1/config >/dev/null; then
            break
          fi
          i=$$((i + 1))
          sleep 1
        done
        ns=$$(curl -sS -o /tmp/ns.out -w '%{http_code}' -X POST http://iceberg-rest:8181/v1/namespaces \
          -H 'Content-Type: application/json' \
          --data-binary @/tmp/namespace.json)
        tbl=$$(curl -sS -o /tmp/tbl.out -w '%{http_code}' -X POST http://iceberg-rest:8181/v1/namespaces/analytics/tables \
          -H 'Content-Type: application/json' \
          --data-binary @/tmp/table.json)
        echo "namespace $$ns table $$tbl"
        case "$$ns" in 200|201|409) ;; *) cat /tmp/ns.out; exit 1 ;; esac
        case "$$tbl" in 200|201|409) ;; *) cat /tmp/tbl.out; exit 1 ;; esac
    restart: "no"

  pico:
    image: ghcr.io/picomq/picomq:latest
    platform: linux/amd64
    environment:
      PICO_PROTOCOL: pico
      PICO_NODE_ID: "1"
      PICO_LISTEN: 0.0.0.0:4437
      PICO_ADMIN_LISTEN: 0.0.0.0:9090
      PICO_HTTP_ADDRESS: http://localhost:4437
      PICO_KAFKA_LISTEN: 0.0.0.0:9092
      PICO_KAFKA_ADVERTISE: localhost:9092
      PICO_AUTH: "off"
      PICO_INSECURE_ALLOW_REMOTE: "true"
      PICO_META_URL: postgres://pico:pico@postgres:5432/picomq
      PICO_SCHEMA_REGISTRY: "3@s3://picomq?region=us-east-1&endpoint=http://rustfs:9000&pathStyle=true"
      PICO_STORAGE: "-2@s3://picomq?region=us-east-1&endpoint=http://rustfs:9000&pathStyle=true"
      PICO_WAL: "0@s3://picomq?region=us-east-1&endpoint=http://rustfs:9000&pathStyle=true&batchInterval=5"
      AWS_ACCESS_KEY_ID: picomq
      AWS_SECRET_ACCESS_KEY: picomqpicomq
      AWS_REGION: us-east-1
    command: ["serve", "--wal-upload-interval-ms", "200", "--wal-upload-threshold", "16777216"]
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    ports:
      - "4437:4437"
      - "8081:8081"
      - "9090:9090"
      - "9092:9092"
    restart: unless-stopped

  connectors:
    build:
      context: .
      dockerfile: Dockerfile
    image: picomq-example-connectors-iceberg:v0.1.1
    platform: linux/amd64
    network_mode: service:pico
    depends_on:
      pico:
        condition: service_started
      createtable:
        condition: service_completed_successfully
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PICOMQ_CONNECTORS_KAFKA__BOOTSTRAP_SERVERS: localhost:9092
    volumes:
      - ./iceberg-sink.toml:/etc/picomq-connectors/connectors/iceberg-sink.toml:ro
      - connectors-state:/var/lib/picomq-connectors/state
    restart: unless-stopped

  duckdb:
    image: duckdb/duckdb:1.4.2
    entrypoint: ["duckdb"]
    stdin_open: true
    tty: true
    environment:
      HOME: /tmp
    volumes:
      - ./sql/duckdb.sql:/opt/duckdb.sql:ro
    depends_on:
      iceberg-rest:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg-data:
  rustfs-data:
  connectors-state:
