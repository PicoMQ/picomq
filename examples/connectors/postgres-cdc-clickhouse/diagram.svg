  <rect x="248" y="156" width="150" height="40" rx="6" fill="#ece7db" stroke="#d4d4d4"/>
  <text x="323" y="181" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#171717">orders.apac</text>
  <rect x="554" y="82" width="150" height="56" rx="6" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="629" y="106" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">ClickHouse</text>
  <text x="629" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">order_events</text>
