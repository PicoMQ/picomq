  <path d="M398 176 L546 120" fill="none" stroke="#737373" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="203" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#737373">data.region</text>
  <text x="478" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#737373">orders.*</text>
