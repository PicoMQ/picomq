<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" role="img" aria-label="Postgres CDC routes order events onto orders.eu, orders.na, and orders.apac. A pattern sink writes them into one ClickHouse table.">
