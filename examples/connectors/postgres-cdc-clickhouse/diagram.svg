  <text x="91" y="124" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#737373">order_events</text>
  <rect x="248" y="24" width="150" height="40" rx="6" fill="#ece7db" stroke="#d4d4d4"/>
