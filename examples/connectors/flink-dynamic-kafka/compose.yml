services:
  pico:
    image: ghcr.io/picomq/picomq:latest
    platform: linux/amd64
    environment:
      PICO_PROTOCOL: pico
      PICO_NODE_ID: "1"
      PICO_LISTEN: 0.0.0.0:4437
      PICO_ADMIN_LISTEN: 0.0.0.0:9090
      PICO_HTTP_ADDRESS: http://localhost:4437
      PICO_KAFKA_LISTEN: 0.0.0.0:9092
      PICO_KAFKA_ADVERTISE: pico:9092
      PICO_AUTH: "off"
      PICO_INSECURE_ALLOW_REMOTE: "true"
      PICO_META_URL: sqlite:/data/meta.db
      PICO_STORAGE: "-2@file:///objects"
    volumes:
      - pico-data:/data
      - pico-objects:/objects
    ports:
      - "4437:4437"
      - "9090:9090"
      - "9092:9092"
    restart: unless-stopped

  flink:
    build:
      context: ./flink-job
      dockerfile: Dockerfile
    image: picomq-example-flink-dynamic-kafka:2.3.0
    hostname: flink
    depends_on:
      pico:
        condition: service_started
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink
      PICO_HTTP: http://pico:4437
      PICO_PREFIX: /fleets.
      KAFKA_BOOTSTRAP: pico:9092
      OUTPUT_PATH: /out
      DISCOVERY_INTERVAL_MS: "2000"
    command: ["standalone-job", "--job-classname", "picomq.example.IngestionJob"]
    volumes:
      - ./out:/out
    restart: unless-stopped

  taskmanager:
    image: picomq-example-flink-dynamic-kafka:2.3.0
    depends_on:
      flink:
        condition: service_started
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: "1"
    command: ["taskmanager"]
    volumes:
      - ./out:/out
    restart: unless-stopped

volumes:
  pico-data:
  pico-objects:
