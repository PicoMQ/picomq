[workspace]
resolver = "2"
# Two areas:
# - s3stream/*: the decoupled, reusable stream engine (extractable to its
#   own repo wholesale. The s3stream/ dir is self-contained: crates, specification,
#   conformance fixtures).
# - picomq/*: host crates (server, metadata, cli) that depend only on the
#   `s3stream` facade crate, never on the engine internals.
members = [
    "s3stream/s3stream-codec",
    "s3stream/s3stream-object",
    "s3stream/s3stream-wal",
    "s3stream/s3stream-core",
    "s3stream/s3stream",
    "picomq/pico-common",
    "picomq/pico-protocol",
    "picomq/pico-auth",
    "picomq/pico-metadata",
    "picomq/pico-sql",
    "picomq/pico-server",
    "picomq/pico-kafka",
    "picomq/pico-http",
    "picomq/pico-runtime",
    "picomq/pico-client",
    "picomq/pico-cli",
    "picomq/pico-schema",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "A durable stream engine on object storage."
repository = "https://github.com/PicoMQ/picomq"

[workspace.dependencies]
s3stream-codec = { path = "s3stream/s3stream-codec" }
s3stream-object = { path = "s3stream/s3stream-object" }
s3stream-wal = { path = "s3stream/s3stream-wal" }
s3stream-core = { path = "s3stream/s3stream-core" }
s3stream = { path = "s3stream/s3stream" }
picomq-common = { path = "picomq/pico-common" }
picomq-protocol = { path = "picomq/pico-protocol", version = "0.1.0" }
picomq-auth = { path = "picomq/pico-auth" }
picomq-metadata = { path = "picomq/pico-metadata" }
picomq-sql = { path = "picomq/pico-sql" }
picomq-server = { path = "picomq/pico-server" }
picomq-kafka = { path = "picomq/pico-kafka" }
picomq-http = { path = "picomq/pico-http" }
picomq-runtime = { path = "picomq/pico-runtime" }
picomq-client = { path = "picomq/pico-client", version = "0.1.0" }
picomq-schema = { path = "picomq/pico-schema" }

# Schema registry / validation (picomq-schema)
anyhow = "1"
apache-avro = "0.21"
jsonschema = "0.45"
pretty_assertions = "1"
protobuf = { version = "3.7", features = ["with-bytes"] }
protobuf-json-mapping = "3.7"
protobuf-parse = "3.7"
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

axum = "0.8"
http = "1"
socket2 = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
tokio-stream = "0.1"
humantime = "2"
rust-embed = "8"

bytes = "1"
kafka-protocol = { version = "0.18", default-features = false, features = ["broker", "client", "gzip", "zstd", "snappy", "lz4"] }
crc32c = "0.6"
hdrhistogram = "7"
crc32fast = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
async-trait = "0.1"
futures = "0.3"
object_store = { version = "0.12", features = ["aws"] }
fastrand = "2"
md-5 = "0.10"
hex = "0.4"
tracing = "0.1"
lru = "0.12"
metrics = "0.24"
im = "15"
arc-swap = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
] }

# test/dev
proptest = "1"
tokio-test = "0.4"
tempfile = "3"
serde_json = "1"
criterion = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
durable-streams = { git = "https://github.com/durable-streams/durable-streams", rev = "a172acc389351cb3db6deb5cd60e3dec11e7ff39" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "allow" # scaffold phase: bodies are todo!() until ported
