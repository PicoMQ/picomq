[workspace]
resolver = "2"
members = [
    "picomq/pico-common",
    "picomq/pico-protocol",
    "picomq/pico-auth",
    "picomq/pico-metadata",
    "picomq/pico-sql",
    "picomq/pico-pgwal",
    "picomq/pico-server",
    "picomq/pico-kafka",
    "picomq/pico-http",
    "picomq/pico-runtime",
    "picomq/pico-client",
    "picomq/pico-cli",
    "picomq/pico-schema",
]
exclude = ["picomq/pico-extension"]
default-members = [
    "picomq/pico-common",
    "picomq/pico-protocol",
    "picomq/pico-auth",
    "picomq/pico-metadata",
    "picomq/pico-sql",
    "picomq/pico-pgwal",
    "picomq/pico-server",
    "picomq/pico-kafka",
    "picomq/pico-http",
    "picomq/pico-runtime",
    "picomq/pico-client",
    "picomq/pico-cli",
    "picomq/pico-schema",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "A durable stream engine on object storage."
repository = "https://github.com/PicoMQ/picomq"

[workspace.dependencies]
s3stream = { git = "https://github.com/PicoMQ/s3stream", tag = "v0.1.0" }
s3stream-wal = { git = "https://github.com/PicoMQ/s3stream", tag = "v0.1.0" }
s3stream-codec = { git = "https://github.com/PicoMQ/s3stream", tag = "v0.1.0" }
picomq-common = { path = "picomq/pico-common" }
picomq-protocol = { path = "picomq/pico-protocol", version = "0.1.1" }
picomq-auth = { path = "picomq/pico-auth" }
picomq-metadata = { path = "picomq/pico-metadata" }
picomq-sql = { path = "picomq/pico-sql" }
picomq-pgwal = { path = "picomq/pico-pgwal" }
picomq-server = { path = "picomq/pico-server" }
picomq-kafka = { path = "picomq/pico-kafka" }
picomq-http = { path = "picomq/pico-http" }
picomq-runtime = { path = "picomq/pico-runtime" }
picomq-client = { path = "picomq/pico-client", version = "0.1.1" }
picomq-schema = { path = "picomq/pico-schema" }

# Schema registry / validation (picomq-schema)
anyhow = "1.0.104"
apache-avro = "0.22.0"
jsonschema = "0.53.0"
pretty_assertions = "1.4.1"
protobuf = { version = "3.7.2", features = ["with-bytes"] }
protobuf-json-mapping = "3.7.2"
protobuf-parse = "3.7.2"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["serde", "v4", "v7"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

axum = "0.8.9"
http = "1.5.0"
socket2 = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
dirs = "6.0.0"
base64 = "0.23.1"
sha2 = "0.11.0"
subtle = "2.6.1"
zeroize = { version = "1.9.0", features = ["derive"] }
getrandom = "0.4.3"
tokio-stream = "0.1.19"
humantime = "2.4.0"
rust-embed = "8.12.0"

bytes = "1.12.1"
kafka-protocol = { version = "0.18.0", default-features = false, features = ["broker", "client", "gzip", "zstd", "snappy", "lz4"] }
rdkafka = { version = "0.39.0", default-features = false, features = ["cmake-build", "tokio"] }
crc32c = "0.6.8"
hdrhistogram = "7.6.0"
crc32fast = "1.5.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
async-trait = "0.1.92"
futures = "0.3.34"
object_store = { version = "0.14.1", features = ["aws"] }
fastrand = "2.5.0"
md-5 = "0.11.0"
hex = "0.4.3"
tracing = "0.1.44"
lru = "0.18.4"
metrics = "0.24.6"
im = "15.1.0"
arc-swap = "1.9.2"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "chrono",
    "json",
] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store", "linux-keyutils-keyring-store"] }


# test/dev
proptest = "1.11.0"
tokio-test = "0.4.5"
tempfile = "3.27.0"
serde_json = "1.0.151"
criterion = "0.8.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
durable-streams = { git = "https://github.com/durable-streams/durable-streams", rev = "a172acc389351cb3db6deb5cd60e3dec11e7ff39" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
todo = "allow" # scaffold phase: bodies are todo!() until ported
