# Single-node PicoMQ: Postgres metadata + RustFS (S3).
# From this directory: docker compose up --build
#
# Host client: http://localhost:4437
# Kafka: localhost:9092
# RustFS API http://localhost:9000, console http://localhost:9001.
# HTTP protocol: set PICO_PROTOCOL=pico|ds in .env (see .env.example).

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: picomq
      POSTGRES_PASSWORD: picomq
      POSTGRES_DB: picomq
    volumes:
      - pg-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picomq -d picomq"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-picomq}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-picomqpicomq}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  createbucket:
    image: amazon/aws-cli:2.36.28
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-picomq}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-picomqpicomq}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://rustfs:9000 s3 mb s3://picomq 2>/dev/null || true
        aws --endpoint-url http://rustfs:9000 s3 ls s3://picomq >/dev/null
    restart: "no"

  pico:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PICO_PROTOCOL: ${PICO_PROTOCOL:-pico}
      PICO_NODE_ID: "1"
      PICO_LISTEN: 0.0.0.0:4437
      PICO_ADMIN_LISTEN: 0.0.0.0:9090
      PICO_HTTP_ADDRESS: http://localhost:4437
      PICO_KAFKA_LISTEN: 0.0.0.0:9092
      PICO_KAFKA_ADVERTISE: localhost:9092
      # Dev default: auth off. Set PICO_AUTH=required and a bootstrap token to turn it on.
      PICO_AUTH: ${PICO_AUTH:-off}
      PICO_INSECURE_ALLOW_REMOTE: ${PICO_INSECURE_ALLOW_REMOTE:-true}
      PICO_AUTH_BOOTSTRAP_TOKEN: ${PICO_AUTH_BOOTSTRAP_TOKEN:-ZGV2L3Jvb3Q.BwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIiMkJSY}
      PICO_META_URL: postgres://picomq:picomq@postgres:5432/picomq
      PICO_SCHEMA_REGISTRY: "3@s3://picomq?region=us-east-1&endpoint=http://rustfs:9000&pathStyle=true"
      PICO_STORAGE: "-2@s3://picomq?region=us-east-1&endpoint=http://rustfs:9000&pathStyle=true"
      # Local RustFS makes S3 requests free, so batch and commit aggressively.
      # On real S3 keep the 250ms default batchInterval.
      PICO_WAL: "0@s3://picomq?region=us-east-1&endpoint=http://rustfs:9000&pathStyle=true&batchInterval=5"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-picomq}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-picomqpicomq}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    command: ["serve", "--wal-upload-interval-ms", "200", "--wal-upload-threshold", "16777216"]
    depends_on:
      postgres:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    ports:
      - "4437:4437"
      - "9090:9090"
      - "9092:9092"
    restart: unless-stopped

volumes:
  pg-data:
  rustfs-data:
