# Keeps each node's WAL in the cluster's Postgres instead of RustFS.
# From this directory: docker compose -f compose.cluster.yml -f compose.pgwal.yml up --build

services:
  pico1:
    environment:
      PICO_WAL: postgres://picomq:picomq@postgres:5432/picomq

  pico2:
    environment:
      PICO_WAL: postgres://picomq:picomq@postgres:5432/picomq
