# Two pico nodes. Postgres + object storage are external (see .env.example).

x-pico: &pico
  build:
    context: ../..
    dockerfile: Dockerfile
  env_file:
    - path: .env
      required: false
  environment: &pico-env
    PICO_PROTOCOL: ${PICO_PROTOCOL:-pico}
    PICO_LISTEN: 0.0.0.0:4437
    PICO_ADMIN_LISTEN: 0.0.0.0:9090
    PICO_META_URL: ${PICO_META_URL:?set PICO_META_URL to your Postgres URL}
    PICO_STORAGE: ${PICO_STORAGE:?set PICO_STORAGE to your object-store URI}
    PICO_AUTH: required
    PICO_AUTH_BOOTSTRAP_TOKEN: ${PICO_AUTH_BOOTSTRAP_TOKEN:?set PICO_AUTH_BOOTSTRAP_TOKEN, see .env.example}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    AWS_REGION: ${AWS_REGION:-us-east-1}
  restart: unless-stopped

services:
  pico1:
    <<: *pico
    environment:
      <<: *pico-env
      PICO_NODE_ID: "1"
      PICO_HTTP_ADDRESS: ${PICO_HTTP_ADDRESS_1:-http://localhost:4437}
    ports:
      - "4437:4437"
      - "9090:9090"

  pico2:
    <<: *pico
    environment:
      <<: *pico-env
      PICO_NODE_ID: "2"
      PICO_HTTP_ADDRESS: ${PICO_HTTP_ADDRESS_2:-http://localhost:4438}
    ports:
      - "4438:4437"
      - "9091:9090"
