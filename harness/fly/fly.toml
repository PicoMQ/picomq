# Single-node PicoMQ on Fly: one Machine, Tigris for objects, any Postgres
# for metadata. From the repo root:
#
#   fly launch --no-deploy --copy-config --config harness/fly/fly.toml
#   fly storage create --name picomq-data
#   fly secrets set PICO_META_URL='postgres://user:pass@host:5432/picomq'
#   fly secrets set PICO_STORAGE='-2@s3://picomq-data?region=auto&endpoint=https://fly.storage.tigris.dev'
#   fly secrets set PICO_AUTH_BOOTSTRAP_TOKEN=...   # see docs/operations/auth
#   fly deploy --config harness/fly/fly.toml
#
# The admin listener (9090) is intentionally not published. Reach it with
# `fly proxy 9090` or over the private network.

app = "picomq"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[processes]
  app = "serve --routing local --shutdown-drain-sec 5"

[env]
  PICO_NODE_ID = "1"
  PICO_LISTEN = "0.0.0.0:4437"
  PICO_ADMIN_LISTEN = "0.0.0.0:9090"
  PICO_HTTP_ADDRESS = "https://picomq.fly.dev"
  PICO_AUTH = "required"

[http_service]
  internal_port = 4437
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[checks.ready]
  type = "http"
  port = 9090
  path = "/ready"
  interval = "10s"
  timeout = "2s"
  grace_period = "20s"
