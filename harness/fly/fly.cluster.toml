# Multi-node PicoMQ on Fly: one Fly app per node, all sharing one Postgres
# and one Tigris bucket. Deploy this config once per node from the repo root,
# overriding the app name and the per-node values:
#
#   fly deploy --config harness/fly/fly.cluster.toml -a picomq-1 \
#     -e PICO_NODE_ID=1 -e PICO_HTTP_ADDRESS=https://picomq-1.fly.dev
#   fly deploy --config harness/fly/fly.cluster.toml -a picomq-2 \
#     -e PICO_NODE_ID=2 -e PICO_HTTP_ADDRESS=https://picomq-2.fly.dev
#
# Every app needs the same secrets:
#   fly secrets set -a picomq-N PICO_META_URL='postgres://user:pass@host:5432/picomq'
#   fly secrets set -a picomq-N PICO_STORAGE='-2@s3://picomq-data?region=auto&endpoint=https://fly.storage.tigris.dev'
#   fly secrets set -a picomq-N AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=...
#   fly secrets set -a picomq-N PICO_AUTH_BOOTSTRAP_TOKEN=...   # same token on every app
#
# Routing stays on redirect, so PICO_HTTP_ADDRESS must be the app's public URL.
# The admin listener (9090) is intentionally not published.

primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[processes]
  app = "serve --shutdown-drain-sec 5"

[env]
  PICO_LISTEN = "0.0.0.0:4437"
  PICO_ADMIN_LISTEN = "0.0.0.0:9090"
  PICO_AUTH = "required"

[http_service]
  internal_port = 4437
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[checks.ready]
  type = "http"
  port = 9090
  path = "/ready"
  interval = "10s"
  timeout = "2s"
  grace_period = "20s"
