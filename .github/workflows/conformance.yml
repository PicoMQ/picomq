name: conformance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        default: all
        options: [all, ds, kafka]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

jobs:
  conformance:
    name: conformance / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ inputs.suite == 'all' && fromJSON('["ds", "kafka"]') || fromJSON(format('["{0}"]', inputs.suite)) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: conformance

      - uses: actions/setup-node@v7
        if: matrix.suite == 'ds'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: picomq/pico-conformance/clients/ds/package-lock.json

      - name: Run suite
        run: cargo run -p picomq-conformance -- ${{ matrix.suite }}
