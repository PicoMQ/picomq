name: clients

on:
  push:
    branches: [main]
    paths:
      - client/**
      - .github/workflows/clients.yml
  pull_request:
    paths:
      - client/**
      - .github/workflows/clients.yml

permissions:
  contents: read

jobs:
  changes:
    name: detect changed clients
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - client/go/**
              - .github/workflows/clients.yml
            typescript:
              - client/typescript/**
              - .github/workflows/clients.yml

  go:
    name: go
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: client/go/go.mod
          cache-dependency-path: client/go/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

  typescript:
    name: typescript
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/typescript/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
