name: e2e

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Which scenario to run
        type: choice
        default: all
        options: [all, single, cluster, ds, extension]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

jobs:
  e2e:
    name: e2e / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ inputs.scenario == 'all' && fromJSON('["single", "cluster", "ds", "extension"]') || fromJSON(format('["{0}"]', inputs.scenario)) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config cmake libcurl4-openssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/typescript/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: client/go/go.mod
          cache-dependency-path: client/go/go.sum

      - uses: docker/setup-buildx-action@v4

      - name: Build the pico image
        if: matrix.scenario != 'extension'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: picomq-e2e:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the pico extension image
        if: matrix.scenario == 'extension'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: picomq/pico-extension/Dockerfile
          load: true
          tags: picomq-pg-e2e:local
          cache-from: type=gha,scope=extension
          cache-to: type=gha,mode=max,scope=extension

      - name: Run scenario
        run: scripts/e2e.sh ${{ matrix.scenario }}
        env:
          SKIP_BUILD: "1"
          PICO_IMAGE: picomq-e2e:local
          PICO_PG_IMAGE: picomq-pg-e2e:local
