name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -Dwarnings

jobs:
  console:
    name: console / check / lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            console/e2e/package-lock.json
            client/typescript/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Build the TypeScript client the console tests use
        working-directory: client/typescript
        run: npm ci && npm run build

      - name: Console scale tests
        working-directory: console/e2e
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
          npm run scale

      - uses: actions/upload-artifact@v7
        with:
          name: console
          path: picomq/pico-http/_console
          if-no-files-found: error

  core:
    name: core / fmt / clippy / test
    needs: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: console
          path: picomq/pico-http/_console

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config cmake libcurl4-openssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: core

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
