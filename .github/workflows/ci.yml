name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -Dwarnings

jobs:
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      connectors: ${{ steps.filter.outputs.connectors }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            connectors:
              - 'connectors/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  core:
    name: core / fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config cmake libcurl4-openssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: core

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --exclude picomq-connectors --exclude 'picomq-connector-*' --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude picomq-connectors --exclude 'picomq-connector-*'

  connectors:
    name: connectors / clippy / test
    needs: changes
    if: needs.changes.outputs.connectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config cmake libcurl4-openssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: connectors

      - name: cargo clippy
        run: cargo clippy -p picomq-connectors -p 'picomq-connector-*' --all-targets -- -D warnings

      - name: cargo test
        run: cargo test -p picomq-connectors -p 'picomq-connector-*'
