name: image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  EXTENSION_IMAGE_NAME: ghcr.io/${{ github.repository }}-pg

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  extension:
    name: extension pg${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: picomq/pico-extension/Dockerfile
          build-args: PG_MAJOR=${{ matrix.pg }}
          target: package
          platforms: linux/amd64
          outputs: type=local,dest=out
          cache-from: type=gha,scope=extension-pg${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=extension-pg${{ matrix.pg }}

      - name: Resolve packaged version
        run: |
          script="$(basename out/extension/pico--*.sql .sql)"
          echo "VERSION=${script#pico--}" >> "$GITHUB_ENV"

      - name: Check tag matches packaged version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match packaged extension version $VERSION"
            exit 1
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.EXTENSION_IMAGE_NAME }}
          tags: |
            type=raw,value=pg${{ matrix.pg }}
            type=semver,pattern={{version}},suffix=-pg${{ matrix.pg }}
            type=sha,prefix=,suffix=-pg${{ matrix.pg }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: picomq/pico-extension/Dockerfile
          build-args: PG_MAJOR=${{ matrix.pg }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=extension-pg${{ matrix.pg }}

      - name: Package tarball
        run: |
          mkdir -p dist
          tar --owner=0 --group=0 --numeric-owner -C out \
            -czf "dist/pico-${VERSION}-pg${{ matrix.pg }}-linux-amd64.tar.gz" lib extension
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: extension-pg${{ matrix.pg }}-linux-amd64
          path: dist/*

  release:
    name: attach release assets
    if: github.ref_type == 'tag'
    needs: [extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
