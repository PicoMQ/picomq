openapi: 3.1.0
info:
  title: PicoMQ HTTP API
  version: 0.1.0
  description: >
    The Pico protocol, PicoMQ's native HTTP API, plus the admin API served by
    each node's admin listener. A topic is addressed by its path. Topics with
    more than one partition take `?partition=N` on every topic request.
    Requests for a partition owned by another node return 307 with the owner's
    address. Every list answers `{items, next}` and continues with `cursor`.
    With auth required, send `Authorization: Bearer <token>` (probes stay
    open).
servers:
  - url: http://127.0.0.1:4437
    description: Protocol listener

tags:
  - name: streams
    description: Topics over the Pico protocol.
  - name: groups
    description: Consumer groups on a Pico protocol listener.
  - name: stream-config
    description: Topic config on the protocol listener.
  - name: admin-cluster
    description: Probes, cluster state, nodes, transfers, and metrics on the admin listener (default port 9090).
  - name: admin-topics
    description: Topics and partitions on the admin listener.
  - name: admin-records
    description: Browsing and producing records on the admin listener.
  - name: admin-groups
    description: Consumer groups on the admin listener.
  - name: admin-tokens
    description: Token control plane on the admin listener.

security:
  - BearerAuth: []

paths:
  /:
    get:
      tags: [streams]
      summary: List topics
      operationId: listStreams
      parameters:
        - name: prefix
          in: query
          description: Name prefix to filter by.
          schema: { type: string, default: "/" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of topics under the prefix that the caller may list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamList" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{stream}:
    parameters:
      - $ref: "#/components/parameters/Stream"
      - $ref: "#/components/parameters/Partition"
    put:
      tags: [streams]
      summary: Create a topic
      description: >
        Creates a topic, with one partition unless Pico-Partitions asks for more.
        Idempotent, and takes no body: append with POST. Names may contain
        slashes, the whole path is the name.
      operationId: createStream
      parameters:
        - name: Content-Type
          in: header
          description: Stored as the stream's content type.
          schema: { type: string, default: application/octet-stream }
        - name: Pico-Partitions
          in: header
          description: Number of partitions. More can be added later through /_streams.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: Pico-TTL
          in: header
          description: Seconds without appends or reads after which the whole topic expires.
          schema: { type: integer, minimum: 0 }
        - name: Pico-Expires-At
          in: header
          description: Absolute expiry time (RFC 3339 or unix ms). Not with Pico-TTL.
          schema: { type: string }
        - name: Pico-Retention-Ms
          in: header
          description: Keep each partition's data for at most this many milliseconds, by write time.
          schema: { type: integer, minimum: 1 }
        - name: Pico-Retention-Bytes
          in: header
          description: Keep at least the newest this many bytes of each partition, dropping whole objects only while the rest still meets the limit.
          schema: { type: integer, minimum: 1 }
        - name: Pico-Closed
          in: header
          description: Create the stream already sealed.
          schema: { type: boolean }
      responses:
        "201":
          description: Created.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Partitions: { $ref: "#/components/headers/Partitions" }
        "200":
          description: Already exists with the same settings.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Partitions: { $ref: "#/components/headers/Partitions" }
        "400":
          description: A body, both expiry headers, or an invalid header.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        "409":
          description: Exists with different settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [streams]
      summary: Append records, or trim
      description: >
        The body is one record in the stream's content type, a JSON batch, or a
        binary batch. With Pico-Trim-Seq set the request is a trim instead and
        takes no body.
      operationId: appendRecords
      parameters:
        - name: Pico-Producer-Id
          in: header
          description: Idempotent producer identity.
          schema: { type: string }
        - name: Pico-Producer-Epoch
          in: header
          schema: { type: integer, minimum: 0 }
        - name: Pico-Producer-Seq
          in: header
          description: Per-producer sequence, accepted exactly once.
          schema: { type: integer, minimum: 0 }
        - name: Pico-Match-Seq
          in: header
          description: Conditional append, succeeds only at this tail sequence.
          schema: { type: integer, minimum: 0 }
        - name: Pico-Closed
          in: header
          description: Seal the topic after this append. With no body, only seals.
          schema: { type: boolean }
        - name: Pico-Trim-Seq
          in: header
          description: Trim records below this sequence instead of appending.
          schema: { type: integer, minimum: 0 }
      requestBody:
        content:
          "*/*":
            schema: { type: string, format: binary }
          application/vnd.picomq.batch+json:
            schema: { $ref: "#/components/schemas/JsonBatch" }
          application/vnd.picomq.batch:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Appended, or trimmed.
          headers:
            Pico-Start-Seq:
              description: Sequence of the first appended record, or the new start after a trim.
              schema: { type: integer }
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Timestamp:
              description: Timestamp assigned to the records.
              schema: { type: string }
            Pico-Producer-Epoch:
              description: The producer epoch the append was accepted at.
              schema: { type: integer }
            Pico-Producer-Seq:
              description: The producer sequence the append was accepted at.
              schema: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          description: Pico-Match-Seq did not match the tail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/Unavailable"
        "409":
          description: Producer sequence gap, sealed topic, or the partition is moving.
          headers:
            Pico-Expected-Seq:
              description: The producer sequence the server expected next.
              schema: { type: integer }
            Pico-Received-Seq:
              description: The sequence the server received.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [streams]
      summary: Read records
      operationId: readRecords
      parameters:
        - name: seq
          in: query
          description: Start position, a number or `now`. Defaults to 0.
          schema: { type: string }
        - name: count
          in: query
          description: Max records returned.
          schema: { type: integer, minimum: 0 }
        - name: bytes
          in: query
          description: Max bytes returned.
          schema: { type: integer, minimum: 0 }
        - name: format
          in: query
          schema: { type: string, enum: [json, binary, raw], default: json }
        - name: live
          in: query
          description: Wait for data instead of returning immediately.
          schema: { type: string, enum: [long-poll, sse] }
        - name: Last-Event-ID
          in: header
          description: SSE reconnect position, used when `seq` is absent.
          schema: { type: string }
        - name: If-None-Match
          in: header
          description: Catch-up reads honor the previous ETag with 304.
          schema: { type: string }
      responses:
        "200":
          description: Records from `seq`.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Up-To-Date:
              description: Present when the response reaches the tail.
              schema: { type: boolean }
            Pico-Closed:
              description: Present when the topic is sealed and fully read.
              schema: { type: boolean }
            Pico-Cursor:
              description: Opaque resume token for paginated catch-up reads.
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadPage" }
            application/vnd.picomq.batch:
              schema: { type: string, format: binary }
            text/event-stream:
              schema: { type: string }
        "204":
          description: Long poll timed out with no new records.
        "304":
          description: Nothing new since the ETag in If-None-Match.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    head:
      tags: [streams]
      summary: Topic metadata
      operationId: headStream
      responses:
        "200":
          description: >
            Metadata in headers, no body. On a topic with several partitions
            the sequences appear only with `?partition=`.
          headers:
            Pico-Partitions: { $ref: "#/components/headers/Partitions" }
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Start-Seq:
              schema: { type: integer }
            Pico-TTL:
              schema: { type: integer }
            Pico-Expires-At:
              schema: { type: string }
            Pico-Closed:
              schema: { type: boolean }
            Pico-Kafka-Topic:
              description: The topic's Kafka name, present when it has one.
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such topic.
    delete:
      tags: [streams]
      summary: Delete a topic
      operationId: deleteStream
      responses:
        "204":
          description: Deleted with all of its partitions. The name is immediately reusable.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such stream.

  /_streams/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The topic name, with or without a leading slash. `orders.eu` and `orders/eu` are the same topic.
        schema: { type: string }
    get:
      tags: [stream-config]
      summary: Read topic config
      operationId: getStreamConfig
      responses:
        "200":
          description: The topic's settings. Unset ones are null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicConfig" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such stream.
    patch:
      tags: [stream-config]
      summary: Change a topic's settings
      operationId: patchStreamConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicUpdate" }
      responses:
        "200":
          description: Updated config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicConfig" }
        "400":
          description: Empty patch, a partition count that does not grow the topic, an attempt to set kafkaTopic, or invalid body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such topic.

  /_groups:
    get:
      tags: [groups]
      summary: List groups
      operationId: listGroups
      parameters:
        - name: prefix
          in: query
          description: Group id prefix to filter by.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of group ids the caller may describe.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { type: string }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /_groups/{group}:
    parameters:
      - $ref: "#/components/parameters/Group"
    get:
      tags: [groups]
      summary: Describe a group
      operationId: describeGroup
      responses:
        "200":
          description: State, generation, and members, from the coordinator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDescription" }
        "404":
          $ref: "#/components/responses/GroupError"
    delete:
      tags: [groups]
      summary: Delete a group and its offsets
      operationId: deleteGroup
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/GroupError"
        "409":
          $ref: "#/components/responses/GroupError"
  /_groups/{group}/members:
    parameters:
      - $ref: "#/components/parameters/Group"
    post:
      tags: [groups]
      summary: Join a group
      description: Returns once the rebalance completes, with the topics assigned to this member.
      operationId: joinGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription:
                  type: array
                  items: { type: string }
                memberId: { type: string }
                instanceId: { type: string }
                clientId: { type: string }
                sessionTimeoutMs: { type: integer, minimum: 1000, maximum: 300000 }
                rebalanceTimeoutMs: { type: integer }
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberId: { type: string }
                  generation: { type: integer }
                  assignment:
                    type: array
                    items: { type: string }
                  members:
                    type: array
                    items: { type: string }
        "409":
          $ref: "#/components/responses/GroupError"
        "429":
          $ref: "#/components/responses/GroupError"
  /_groups/{group}/members/{member}:
    parameters:
      - $ref: "#/components/parameters/Group"
      - $ref: "#/components/parameters/Member"
    get:
      tags: [groups]
      summary: A member's current assignment
      operationId: groupAssignment
      parameters:
        - name: generation
          in: query
          required: true
          schema: { type: integer }
        - name: instance_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The assignment at this generation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generation: { type: integer }
                  assignment:
                    type: array
                    items: { type: string }
        "404":
          $ref: "#/components/responses/GroupError"
        "409":
          $ref: "#/components/responses/GroupError"
    delete:
      tags: [groups]
      summary: Leave a group
      operationId: leaveGroup
      parameters:
        - name: instance_id
          in: query
          schema: { type: string }
      responses:
        "204":
          description: Left.
  /_groups/{group}/members/{member}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/Group"
      - $ref: "#/components/parameters/Member"
    post:
      tags: [groups]
      summary: Keep a member alive
      operationId: heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation]
              properties:
                generation: { type: integer }
                instanceId: { type: string }
      responses:
        "204":
          description: Alive.
        "404":
          $ref: "#/components/responses/GroupError"
        "409":
          $ref: "#/components/responses/GroupError"
  /_groups/{group}/offsets:
    parameters:
      - $ref: "#/components/parameters/Group"
    put:
      tags: [groups]
      summary: Commit offsets
      description: >
        Send memberId and generation together to commit as a member. Without
        them the commit is accepted only while the group has no members.
      operationId: commitOffsets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offsets]
              properties:
                offsets: { $ref: "#/components/schemas/Offsets" }
                memberId: { type: string }
                generation: { type: integer }
                instanceId: { type: string }
      responses:
        "204":
          description: Committed.
        "409":
          $ref: "#/components/responses/GroupError"
    get:
      tags: [groups]
      summary: Fetch committed offsets
      operationId: fetchOffsets
      parameters:
        - name: stream
          in: query
          description: Topics to fetch, repeated. All of them when absent.
          schema:
            type: array
            items: { type: string }
          explode: true
      responses:
        "200":
          description: Committed offsets by topic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offsets: { $ref: "#/components/schemas/Offsets" }

  /health:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-cluster]
      summary: Liveness
      operationId: health
      security: []
      responses:
        "200":
          description: The process is up.
  /ready:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-cluster]
      summary: Readiness
      operationId: ready
      security: []
      responses:
        "200":
          description: Serving and registered in the metadata state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready, with the same body. A fenced node is never ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /metrics:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-cluster]
      summary: This node's metrics
      description: Needs node_read.
      operationId: metrics
      responses:
        "200":
          $ref: "#/components/responses/Metrics"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/cluster:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-cluster]
      summary: Cluster state
      description: Needs cluster_read.
      operationId: getCluster
      responses:
        "200":
          description: Identity, counts, applied index, lease holder, pending transfers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/overview:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-cluster]
      summary: Largest and busiest topics
      description: Needs cluster_read. Recomputed at most every 60 seconds.
      operationId: getOverview
      responses:
        "200":
          description: The ten largest topics by stored bytes and the ten busiest by write rate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/transfers:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-cluster]
      summary: List pending transfers
      description: Needs cluster_read.
      operationId: listTransfers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of pending transfers.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Transfer" }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
    post:
      tags: [admin-cluster]
      summary: Transfer a partition to another node
      description: Needs transfer_stream.
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, toNode]
              properties:
                topic: { type: string }
                partition: { type: integer, minimum: 0, description: Required for topics with several partitions. }
                toNode: { type: integer }
      responses:
        "202":
          description: Transfer recorded. Completion is asynchronous.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          description: The partition is not open, or a conflicting transfer is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
  /admin/nodes:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-cluster]
      summary: List nodes
      description: Needs node_read.
      operationId: listNodes
      parameters:
        - name: fenced
          in: query
          description: Only fenced nodes, or only live ones.
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of registered nodes by id.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/nodes/{id}:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [admin-cluster]
      summary: Describe a node
      description: Needs node_read.
      operationId: getNode
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    post:
      tags: [admin-cluster]
      summary: Update a node's placement slots
      description: Needs update_node_slots.
      operationId: updateNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The updated node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
  /admin/nodes/{id}/metrics:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/NodeId"
    get:
      tags: [admin-cluster]
      summary: Another node's metrics
      description: Needs node_read. Forwarded to the node named.
      operationId: nodeMetrics
      responses:
        "200":
          $ref: "#/components/responses/Metrics"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "502":
          $ref: "#/components/responses/ForwardFailed"
        "504":
          $ref: "#/components/responses/ForwardFailed"

  /admin/topics:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-topics]
      summary: List topics
      description: Needs list, checked on each topic.
      operationId: adminListTopics
      parameters:
        - name: prefix
          in: query
          description: Name prefix to filter by.
          schema: { type: string, default: "/" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of topics by name.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Topic" }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
    post:
      tags: [admin-topics]
      summary: Create a topic
      description: Needs create.
      operationId: adminCreateTopic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicCreate" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "200":
          description: Already exists with the same settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          description: Exists with different settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
  /admin/topics/{name}:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/TopicName"
    get:
      tags: [admin-topics]
      summary: Describe a topic
      description: Needs head.
      operationId: adminGetTopic
      responses:
        "200":
          description: The topic with stored bytes and owners.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicDetail" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    patch:
      tags: [admin-topics]
      summary: Change a topic's settings
      description: Needs create.
      operationId: adminUpdateTopic
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopicUpdate" }
      responses:
        "200":
          description: The updated topic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topic" }
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    delete:
      tags: [admin-topics]
      summary: Delete a topic
      description: Needs delete.
      operationId: adminDeleteTopic
      responses:
        "204":
          description: Deleted with all of its partitions.
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
  /admin/topics/{name}/partitions:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/TopicName"
    get:
      tags: [admin-topics]
      summary: List partitions
      description: Needs head. Offsets come live from each partition's owner.
      operationId: listPartitions
      parameters:
        - name: node
          in: query
          description: Only partitions this node owns.
          schema: { type: integer }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of partitions by index.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Partition" }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
  /admin/topics/{name}/partitions/{index}:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/TopicName"
      - $ref: "#/components/parameters/Index"
    get:
      tags: [admin-topics]
      summary: Describe a partition
      description: Needs head.
      operationId: getPartition
      responses:
        "200":
          description: The partition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Partition" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
  /admin/topics/{name}/partitions/{index}/trim:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/TopicName"
      - $ref: "#/components/parameters/Index"
    post:
      tags: [admin-topics]
      summary: Delete records before an offset
      description: Needs trim. Answered by the partition's owner.
      operationId: trimPartition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before]
              properties:
                before: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The partition's new start offset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  startOffset: { type: integer }
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"

  /admin/topics/{name}/partitions/{index}/records:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/TopicName"
      - $ref: "#/components/parameters/Index"
    get:
      tags: [admin-records]
      summary: Browse records
      description: >
        Needs read. Answered by the partition's owner. Fields are cut to a
        4 KiB preview. Filters run under a scan budget, so a page can be short
        while `next` is set.
      operationId: listRecords
      parameters:
        - name: offset
          in: query
          description: Start at this offset. Defaults to 0. Not with `timestamp`.
          schema: { type: integer, minimum: 0 }
        - name: timestamp
          in: query
          description: Start at the first record at or after these epoch milliseconds.
          schema: { type: integer }
        - name: key
          in: query
          description: Keep records whose key contains this text.
          schema: { type: string }
        - name: value
          in: query
          description: Keep records whose value contains this text.
          schema: { type: string }
        - name: header
          in: query
          description: Keep records with this header.
          schema: { type: string }
        - name: headerValue
          in: query
          description: With `header`, keep records whose header value contains this text.
          schema: { type: string }
        - name: wait
          in: query
          description: Milliseconds to wait for new records when none are there yet.
          schema: { type: integer, minimum: 0, maximum: 5000 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of records by offset.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminRecord" }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    post:
      tags: [admin-records]
      summary: Produce a record
      description: Needs append. Answered by the partition's owner. The body is at most 2 MiB.
      operationId: produceRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordWrite" }
      responses:
        "201":
          description: Appended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offset: { type: integer }
                  timestamp: { type: [integer, "null"] }
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "413":
          description: The body is too large.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
  /admin/topics/{name}/partitions/{index}/records/{offset}:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/TopicName"
      - $ref: "#/components/parameters/Index"
      - name: offset
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
    get:
      tags: [admin-records]
      summary: Read one record
      description: Needs read. Fields up to 1 MiB.
      operationId: getRecord
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRecord" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"

  /admin/groups:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-groups]
      summary: List groups
      description: Needs describe_group, checked on each group. Each group's state comes from its coordinator.
      operationId: adminListGroups
      parameters:
        - name: prefix
          in: query
          description: Group id prefix to filter by.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of groups by id.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/groups/{group}:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/Group"
    get:
      tags: [admin-groups]
      summary: Describe a group
      description: Needs describe_group. Answered by the coordinator.
      operationId: adminGetGroup
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    delete:
      tags: [admin-groups]
      summary: Delete a group and its offsets
      description: Needs delete_group.
      operationId: adminDeleteGroup
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/GroupHasMembers"
  /admin/groups/{group}/members:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/Group"
    get:
      tags: [admin-groups]
      summary: List members
      description: Needs describe_group.
      operationId: listMembers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
  /admin/groups/{group}/offsets:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/Group"
    get:
      tags: [admin-groups]
      summary: List committed offsets with lag
      description: Needs describe_group, and head on each topic shown.
      operationId: listGroupOffsets
      parameters:
        - name: topic
          in: query
          description: Only this topic.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of committed offsets.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GroupOffset" }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    delete:
      tags: [admin-groups]
      summary: Delete one topic's offsets
      description: Needs delete_group.
      operationId: deleteGroupOffsets
      parameters:
        - name: topic
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/GroupHasMembers"
  /admin/groups/{group}/offsets/reset:
    servers: [{ url: "http://127.0.0.1:9090" }]
    parameters:
      - $ref: "#/components/parameters/Group"
    post:
      tags: [admin-groups]
      summary: Reset offsets
      description: Needs consume on the group and read on the topic.
      operationId: resetGroupOffsets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OffsetReset" }
      responses:
        "200":
          description: The new positions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  partitions:
                    type: array
                    items:
                      type: object
                      properties:
                        partition: { type: integer }
                        offset: { type: integer }
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/GroupHasMembers"

  /admin/tokens:
    servers: [{ url: "http://127.0.0.1:9090" }]
    get:
      tags: [admin-tokens]
      summary: List tokens
      description: Needs list_tokens. Secrets are never returned.
      operationId: listTokens
      parameters:
        - name: prefix
          in: query
          description: Token id prefix to filter by.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tokens by id.
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TokenRecord" }
                  next: { $ref: "#/components/schemas/Next" }
        "400":
          $ref: "#/components/responses/BadPage"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
    post:
      tags: [admin-tokens]
      summary: Issue a token
      description: Needs issue_token, and the new scope must be narrower than the caller's.
      operationId: issueToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueTokenRequest" }
      responses:
        "201":
          description: Issued. The wire token appears once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueTokenResponse" }
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          description: Token id already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
  /admin/tokens/{id}:
    servers: [{ url: "http://127.0.0.1:9090" }]
    delete:
      tags: [admin-tokens]
      summary: Revoke a token
      description: Needs revoke_token.
      operationId: revokeToken
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          description: Token changed concurrently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    Stream:
      name: stream
      in: path
      required: true
      description: The topic name. Names are paths and may contain slashes.
      schema: { type: string }
    Partition:
      name: partition
      in: query
      description: The partition. Required on topics with several partitions.
      schema: { type: integer, minimum: 0 }
    Group:
      name: group
      in: path
      required: true
      schema: { type: string }
    Member:
      name: member
      in: path
      required: true
      schema: { type: string }
    TopicName:
      name: name
      in: path
      required: true
      description: The full topic name, URL-encoded.
      schema: { type: string }
    Index:
      name: index
      in: path
      required: true
      description: The partition index.
      schema: { type: integer, minimum: 0 }
    NodeId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Cursor:
      name: cursor
      in: query
      description: The `next` of the previous page. Send the same filters with it.
      schema: { type: string }
  headers:
    NextSeq:
      description: The partition's next sequence. Pass as `seq` to resume.
      schema: { type: integer }
    Partitions:
      description: The topic's partition count.
      schema: { type: integer }
  responses:
    Unauthenticated:
      description: Missing or invalid credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, enum: [Bearer] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Valid credential, insufficient scope (or producer fencing on append).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The node is stopping or metadata is unreachable. Retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadPage:
      description: An invalid limit or filter, or a cursor sent with different filters.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GroupError:
      description: >
        unknown_member, not_found, rebalance_in_progress, illegal_generation,
        inconsistent_protocol, conflict, fenced, capacity_exceeded, or
        coordinator_unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminBadRequest:
      description: Invalid parameters or body.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
    AdminUnauthenticated:
      description: Missing or invalid credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, enum: [Bearer] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
    AdminForbidden:
      description: Valid credential, insufficient scope, or a token with autoPrefix.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
    AdminNotFound:
      description: No such topic, partition, record, group, node, or token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
    GroupHasMembers:
      description: The group still has members.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
    ForwardFailed:
      description: The node that holds the answer could not be reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
    Metrics:
      description: Counters and gauges since process start.
      content:
        text/plain:
          schema: { type: string, description: Prometheus text format. }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        next_seq: { type: integer }
    MessageError:
      type: object
      description: Errors on the admin listener and the topic config route.
      required: [error]
      properties:
        error: { type: string, description: A message. }
    Next:
      type: [string, "null"]
      description: The cursor for the next page, null on the last one.
    Header:
      type: object
      required: [name]
      description: A header value is null, text in `value`, or other bytes in `value_b64`.
      properties:
        name: { type: string }
        value: { type: [string, "null"] }
        value_b64: { type: string }
    PicoRecord:
      type: object
      description: >
        Text goes in `key`, `body`, and header `value`. Other bytes use the
        `_b64` field instead. A null body is a tombstone. An absent key means
        no key.
      properties:
        key: { type: [string, "null"] }
        key_b64: { type: string }
        headers:
          type: array
          description: In record order, so a name can repeat.
          items: { $ref: "#/components/schemas/Header" }
        body: { type: [string, "null"] }
        body_b64: { type: string }
    JsonBatch:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/PicoRecord" }
    ReadPage:
      type: array
      items:
        allOf:
          - $ref: "#/components/schemas/PicoRecord"
          - type: object
            required: [seq, timestamp]
            properties:
              seq: { type: integer }
              timestamp: { type: integer }
    StreamList:
      type: object
      required: [items, next]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              content_type: { type: string }
              partitions: { type: integer }
              closed: { type: boolean }
              ttl: { type: integer }
              expires_at: { type: string }
        next: { $ref: "#/components/schemas/Next" }
    TopicConfig:
      type: object
      properties:
        partitions: { type: integer, minimum: 1 }
        kafkaTopic: { type: [string, "null"], description: Follows from the name. Read only. }
        retentionMs: { type: [integer, "null"], minimum: 1, description: Null when unlimited. }
        retentionBytes: { type: [integer, "null"], minimum: 1, description: Null when unlimited. }
    TopicUpdate:
      type: object
      properties:
        retentionMs: { type: [integer, "null"], minimum: 1 }
        retentionBytes: { type: [integer, "null"], minimum: 1 }
        partitions:
          type: integer
          description: Grows the topic to this many partitions, at most 10000 more at a time. Never shrinks it.
    Offsets:
      type: object
      additionalProperties:
        type: object
        required: [position]
        properties:
          position: { type: integer }
          metadata: { type: [string, "null"] }
    GroupDescription:
      type: object
      properties:
        group: { type: string }
        state: { type: string }
        generation: { type: integer }
        protocolType: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              memberId: { type: string }
              instanceId: { type: [string, "null"] }
              clientId: { type: string }
              subscription:
                type: array
                items: { type: string }
              assignment:
                type: array
                items: { type: string }
    Readiness:
      type: object
      properties:
        ready: { type: boolean }
        serving: { type: boolean }
        registered: { type: boolean }
        fenced: { type: boolean }
        appliedIndex: { type: integer }
        nodeId: { type: integer }
    Cluster:
      type: object
      properties:
        clusterId: { type: string }
        nodeId: { type: integer }
        nodeEpoch: { type: integer }
        advertisedAddress: { type: string }
        registered: { type: boolean }
        fenced: { type: boolean }
        appliedIndex: { type: integer }
        streamCount: { type: integer }
        objectCount: { type: integer }
        streamSetObjectCount: { type: integer }
        streamObjectCount: { type: integer }
        preparedObjectCount: { type: integer }
        kvEntryCount: { type: integer }
        kvBytes: { type: integer }
        gc:
          type: object
          description: Destroyed-object cleanup backlog.
          properties:
            backlog: { type: integer }
            oldestSeq: { type: [integer, "null"] }
            nextSeq: { type: integer }
        snapshot:
          type: object
          description: Metadata snapshot cycle stats.
          properties:
            lastAppliedIndex: { type: integer }
            lastBytes: { type: integer }
            lastDurationMs: { type: integer }
            lastAtMs: { type: integer }
            taken: { type: integer }
            failed: { type: integer }
        leaseHolder:
          type: [boolean, "null"]
          description: Whether this node holds the maintenance lease. Null when unknown.
        pendingTransferCount: { type: integer }
    Overview:
      type: object
      properties:
        computedAtMs: { type: integer }
        topicsBySize:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              storedBytes: { type: integer }
        topicsByWriteRate:
          type: array
          items:
            type: object
            properties:
              topic: { type: string }
              recordsPerSecond: { type: number }
        writeRateSinceMs:
          type: [integer, "null"]
          description: Start of the window the write rates cover. Null on a node's first pass, when there is no rate yet.
    Transfer:
      type: object
      properties:
        log:
          type: [object, "null"]
          description: The partition, or the group, being moved.
          properties:
            topic: { type: string }
            partition: { type: integer }
            group: { type: string }
        fromNode: { type: integer }
        toNode: { type: integer }
    Node:
      type: object
      properties:
        nodeId: { type: integer }
        nodeEpoch: { type: integer }
        advertisedAddress: { type: [string, "null"] }
        slots: { type: integer }
        openingCount: { type: integer }
        placedCount: { type: integer }
        local: { type: boolean }
        fenced: { type: boolean }
    Topic:
      type: object
      properties:
        name: { type: string }
        id: { type: string }
        partitions: { type: integer }
        contentType: { type: string }
        kafkaTopic: { type: [string, "null"] }
        retentionMs: { type: [integer, "null"] }
        retentionBytes: { type: [integer, "null"] }
        ttlSeconds: { type: [integer, "null"] }
        expiresAtMs: { type: [integer, "null"] }
        closed: { type: boolean }
    TopicDetail:
      allOf:
        - $ref: "#/components/schemas/Topic"
        - type: object
          properties:
            storedBytes: { type: integer }
            owners:
              type: array
              items:
                type: object
                properties:
                  nodeId: { type: [integer, "null"] }
                  partitions: { type: integer }
    TopicCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        partitions: { type: integer, minimum: 1 }
        contentType: { type: string }
        retentionMs: { type: integer, minimum: 1 }
        retentionBytes: { type: integer, minimum: 1 }
        ttlSeconds: { type: integer, minimum: 0 }
    Partition:
      type: object
      properties:
        index: { type: integer }
        streamId: { type: [integer, "null"] }
        ownerNodeId: { type: [integer, "null"] }
        epoch: { type: [integer, "null"] }
        state: { type: [string, "null"], enum: [opened, closed, null] }
        pendingTransfer:
          type: [object, "null"]
          properties:
            fromNode: { type: integer }
            toNode: { type: integer }
        startOffset: { type: [integer, "null"] }
        nextOffset: { type: [integer, "null"] }
        current: { type: boolean, description: False when the owner could not be asked and the offsets are missing. }
        storedBytes: { type: [integer, "null"] }
    Field:
      type: object
      properties:
        data: { type: string }
        encoding: { type: string, enum: [utf8, base64] }
        size: { type: integer, description: The full length in bytes. }
        truncated: { type: boolean }
    AdminRecord:
      type: object
      properties:
        offset: { type: integer }
        timestamp: { type: integer }
        key:
          oneOf: [{ $ref: "#/components/schemas/Field" }, { type: "null" }]
        value:
          oneOf: [{ $ref: "#/components/schemas/Field" }, { type: "null" }]
        headers:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              value:
                oneOf: [{ $ref: "#/components/schemas/Field" }, { type: "null" }]
    FieldWrite:
      type: object
      required: [data, encoding]
      additionalProperties: false
      properties:
        data: { type: string }
        encoding: { type: string, enum: [utf8, base64] }
    RecordWrite:
      type: object
      additionalProperties: false
      properties:
        key:
          oneOf: [{ $ref: "#/components/schemas/FieldWrite" }, { type: "null" }]
        value:
          description: Null is a tombstone.
          oneOf: [{ $ref: "#/components/schemas/FieldWrite" }, { type: "null" }]
        headers:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              value:
                oneOf: [{ $ref: "#/components/schemas/FieldWrite" }, { type: "null" }]
    GroupState:
      type: string
      enum: [Empty, PreparingRebalance, CompletingRebalance, Stable]
    Group:
      type: object
      properties:
        groupId: { type: string }
        state:
          oneOf: [{ $ref: "#/components/schemas/GroupState" }, { type: "null" }]
          description: Null when the coordinator could not be asked.
        protocolType: { type: string }
        protocolName: { type: string }
        generation: { type: integer }
        members: { type: integer }
        coordinatorNodeId: { type: [integer, "null"] }
        current: { type: boolean }
    GroupDetail:
      type: object
      properties:
        groupId: { type: string }
        state: { $ref: "#/components/schemas/GroupState" }
        protocolType: { type: string }
        protocolName: { type: string }
        generation: { type: integer }
        members: { type: integer }
        coordinatorNodeId: { type: integer }
        committedPartitions: { type: integer }
    Member:
      type: object
      properties:
        memberId: { type: string }
        instanceId: { type: [string, "null"] }
        clientId: { type: string }
        clientHost: { type: string }
        assignment:
          description: >
            Topics for Pico members, topics and partitions decoded from Kafka
            consumers, or only the size for other Kafka protocols.
          oneOf:
            - type: object
              properties:
                streams:
                  type: array
                  items: { type: string }
            - type: object
              properties:
                topics:
                  type: array
                  items:
                    type: object
                    properties:
                      topic: { type: string }
                      partitions:
                        type: array
                        items: { type: integer }
            - type: object
              properties:
                bytes: { type: integer }
    GroupOffset:
      type: object
      properties:
        topic: { type: [string, "null"] }
        partition: { type: integer }
        committedOffset: { type: integer }
        metadata: { type: [string, "null"] }
        nextOffset: { type: [integer, "null"] }
        lag: { type: [integer, "null"] }
        current: { type: boolean }
    OffsetReset:
      type: object
      required: [topic, to]
      properties:
        topic: { type: string }
        to:
          oneOf:
            - type: string
              enum: [earliest, latest]
            - type: object
              required: [offset]
              properties:
                offset: { type: integer, minimum: 0 }
            - type: object
              required: [timestamp]
              properties:
                timestamp: { type: integer }
        partitions:
          type: array
          description: All partitions when absent.
          items: { type: integer }
    ResourceMatcher:
      type: object
      oneOf:
        - required: [exact]
          properties:
            exact: { type: string }
        - required: [prefix]
          properties:
            prefix: { type: string }
    ReadWrite:
      type: object
      properties:
        read: { type: boolean }
        write: { type: boolean }
    Scope:
      type: object
      properties:
        streams:
          type: array
          items: { $ref: "#/components/schemas/ResourceMatcher" }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/ResourceMatcher" }
        groups:
          type: array
          items: { $ref: "#/components/schemas/ResourceMatcher" }
        access:
          type: object
          properties:
            stream: { $ref: "#/components/schemas/ReadWrite" }
            tokens: { $ref: "#/components/schemas/ReadWrite" }
            group: { $ref: "#/components/schemas/ReadWrite" }
            admin: { $ref: "#/components/schemas/ReadWrite" }
        ops:
          type: array
          items:
            type: string
            enum:
              [
                read,
                head,
                list,
                create,
                append,
                trim,
                close,
                delete,
                issue_token,
                revoke_token,
                list_tokens,
                consume,
                describe_group,
                delete_group,
                cluster_read,
                node_read,
                transfer_stream,
                update_node_slots,
              ]
        audiences:
          type: array
          items: { type: string, enum: [pico, durable_streams, kafka, admin] }
        autoPrefix: { type: boolean }
        expiresAtMs: { type: [integer, "null"] }
    TokenRecord:
      type: object
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/Scope" }
        createdAtMs: { type: integer }
        issuedBy: { type: string }
    IssueTokenRequest:
      type: object
      required: [id, scope]
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/Scope" }
    IssueTokenResponse:
      allOf:
        - $ref: "#/components/schemas/TokenRecord"
        - type: object
          properties:
            token: { type: string, description: The wire token, shown only here. }
