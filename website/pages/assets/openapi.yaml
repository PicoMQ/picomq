openapi: 3.1.0
info:
  title: PicoMQ HTTP API
  version: 0.1.0
  description: >
    The Pico protocol, PicoMQ's native HTTP API, plus the admin API served by
    each node's admin listener. A topic is addressed by its path. Topics with
    more than one partition take `?partition=N` on every topic request.
    Requests for a partition owned by another node return 307 with the owner's
    address. With auth required, send `Authorization: Bearer <token>` (probes
    stay open).
servers:
  - url: http://127.0.0.1:4437
    description: Protocol listener

tags:
  - name: streams
    description: Topics over the Pico protocol.
  - name: groups
    description: Consumer groups on a Pico protocol listener.
  - name: schemas
    description: Schema registry on the protocol listener.
  - name: stream-config
    description: Topic config on the protocol listener.
  - name: admin
    description: Admin listener endpoints (default port 9090).
  - name: tokens
    description: Token control plane on the admin listener.

security:
  - BearerAuth: []

paths:
  /:
    get:
      tags: [streams]
      summary: List topics
      operationId: listStreams
      parameters:
        - name: prefix
          in: query
          description: Name prefix to filter by.
          schema: { type: string, default: "/" }
        - name: start_after
          in: query
          description: Continue after this name from the previous page.
          schema: { type: string }
        - name: limit
          in: query
          description: Page size cap.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Topics under the prefix that the caller may read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamList" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{stream}:
    parameters:
      - $ref: "#/components/parameters/Stream"
      - $ref: "#/components/parameters/Partition"
    put:
      tags: [streams]
      summary: Create a topic
      description: >
        Creates a topic, with one partition unless Pico-Partitions asks for more.
        Idempotent, and takes no body: append with POST. Names may contain
        slashes, the whole path is the name.
      operationId: createStream
      parameters:
        - name: Content-Type
          in: header
          description: Stored as the stream's content type.
          schema: { type: string, default: application/octet-stream }
        - name: Pico-Partitions
          in: header
          description: Number of partitions. More can be added later through /_streams.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: Pico-TTL
          in: header
          description: Seconds without appends or reads after which the whole topic expires.
          schema: { type: integer, minimum: 0 }
        - name: Pico-Expires-At
          in: header
          description: Absolute expiry time (RFC 3339 or unix ms). Not with Pico-TTL.
          schema: { type: string }
        - name: Pico-Retention-Ms
          in: header
          description: Keep each partition's data for at most this many milliseconds, by write time.
          schema: { type: integer, minimum: 1 }
        - name: Pico-Retention-Bytes
          in: header
          description: Keep at most this many bytes of each partition, the newest.
          schema: { type: integer, minimum: 1 }
        - name: Pico-Closed
          in: header
          description: Create the stream already sealed.
          schema: { type: boolean }
        - name: Pico-Schema
          in: header
          description: Bind a registered schema by name.
          schema: { type: string }
        - name: Pico-Schema-Validate
          in: header
          description: Validate appends against the bound schema. Defaults to false.
          schema: { type: boolean }
      responses:
        "201":
          description: Created.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Partitions: { $ref: "#/components/headers/Partitions" }
        "200":
          description: Already exists with the same settings.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Partitions: { $ref: "#/components/headers/Partitions" }
        "400":
          description: A body, both expiry headers, or an invalid header.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        "409":
          description: Exists with different settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [streams]
      summary: Append records, or trim
      description: >
        The body is one record in the stream's content type, a JSON batch, or a
        binary batch. With Pico-Trim-Seq set the request is a trim instead and
        takes no body.
      operationId: appendRecords
      parameters:
        - name: Pico-Producer-Id
          in: header
          description: Idempotent producer identity.
          schema: { type: string }
        - name: Pico-Producer-Epoch
          in: header
          schema: { type: integer, minimum: 0 }
        - name: Pico-Producer-Seq
          in: header
          description: Per-producer sequence, accepted exactly once.
          schema: { type: integer, minimum: 0 }
        - name: Pico-Match-Seq
          in: header
          description: Conditional append, succeeds only at this tail sequence.
          schema: { type: integer, minimum: 0 }
        - name: Pico-Closed
          in: header
          description: Seal the topic after this append. With no body, only seals.
          schema: { type: boolean }
        - name: Pico-Trim-Seq
          in: header
          description: Trim records below this sequence instead of appending.
          schema: { type: integer, minimum: 0 }
      requestBody:
        content:
          "*/*":
            schema: { type: string, format: binary }
          application/vnd.picomq.batch+json:
            schema: { $ref: "#/components/schemas/JsonBatch" }
          application/vnd.picomq.batch:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Appended, or trimmed.
          headers:
            Pico-Start-Seq:
              description: Sequence of the first appended record, or the new start after a trim.
              schema: { type: integer }
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Timestamp:
              description: Timestamp assigned to the records.
              schema: { type: string }
            Pico-Producer-Epoch:
              description: The producer epoch the append was accepted at.
              schema: { type: integer }
            Pico-Producer-Seq:
              description: The producer sequence the append was accepted at.
              schema: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          description: Pico-Match-Seq did not match the tail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/Unavailable"
        "409":
          description: Producer sequence gap, sealed topic, or the partition is moving.
          headers:
            Pico-Expected-Seq:
              description: The producer sequence the server expected next.
              schema: { type: integer }
            Pico-Received-Seq:
              description: The sequence the server received.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [streams]
      summary: Read records
      operationId: readRecords
      parameters:
        - name: seq
          in: query
          description: Start position, a number or `now`. Defaults to 0.
          schema: { type: string }
        - name: count
          in: query
          description: Max records returned.
          schema: { type: integer, minimum: 0 }
        - name: bytes
          in: query
          description: Max bytes returned.
          schema: { type: integer, minimum: 0 }
        - name: format
          in: query
          schema: { type: string, enum: [json, binary, raw], default: json }
        - name: live
          in: query
          description: Wait for data instead of returning immediately.
          schema: { type: string, enum: [long-poll, sse] }
        - name: Last-Event-ID
          in: header
          description: SSE reconnect position, used when `seq` is absent.
          schema: { type: string }
        - name: If-None-Match
          in: header
          description: Catch-up reads honor the previous ETag with 304.
          schema: { type: string }
      responses:
        "200":
          description: Records from `seq`.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Up-To-Date:
              description: Present when the response reaches the tail.
              schema: { type: boolean }
            Pico-Closed:
              description: Present when the topic is sealed and fully read.
              schema: { type: boolean }
            Pico-Cursor:
              description: Opaque resume token for paginated catch-up reads.
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadPage" }
            application/vnd.picomq.batch:
              schema: { type: string, format: binary }
            text/event-stream:
              schema: { type: string }
        "204":
          description: Long poll timed out with no new records.
        "304":
          description: Nothing new since the ETag in If-None-Match.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    head:
      tags: [streams]
      summary: Topic metadata
      operationId: headStream
      responses:
        "200":
          description: >
            Metadata in headers, no body. On a topic with several partitions
            the sequences appear only with `?partition=`.
          headers:
            Pico-Partitions: { $ref: "#/components/headers/Partitions" }
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Start-Seq:
              schema: { type: integer }
            Pico-TTL:
              schema: { type: integer }
            Pico-Expires-At:
              schema: { type: string }
            Pico-Closed:
              schema: { type: boolean }
            Pico-Schema:
              description: The bound schema name, present when bound.
              schema: { type: string }
            Pico-Kafka-Topic:
              description: The topic's Kafka name, present when it has one.
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such topic.
    delete:
      tags: [streams]
      summary: Delete a topic
      operationId: deleteStream
      responses:
        "204":
          description: Deleted with all of its partitions. The name is immediately reusable.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such stream.

  /_streams/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The topic name, with or without a leading slash. `orders.eu` and `orders/eu` are the same topic.
        schema: { type: string }
    get:
      tags: [stream-config]
      summary: Read topic config
      operationId: getStreamConfig
      responses:
        "200":
          description: The topic's settings. Unset ones are null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicConfig" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such stream.
    patch:
      tags: [stream-config]
      summary: Change a topic's settings
      operationId: patchStreamConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schema: { type: [string, "null"] }
                schemaValidate: { type: boolean }
                retentionMs: { type: [integer, "null"], minimum: 1 }
                retentionBytes: { type: [integer, "null"], minimum: 1 }
                partitions:
                  type: integer
                  description: Grows the topic to this many partitions, at most 10000 more at a time. Never shrinks it.
      responses:
        "200":
          description: Updated config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopicConfig" }
        "400":
          description: Empty patch, unknown schema, a partition count that does not grow the topic, an attempt to set kafkaTopic, or invalid body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such topic.

  /_schemas/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The schema name. Names are paths and may contain slashes.
        schema: { type: string }
    put:
      tags: [schemas]
      summary: Register a schema
      description: >
        Store or replace a schema. The format comes from the Content-Type, or
        from an extension on the name. 400 when the schema does not parse or
        the node runs without a schema registry.
      operationId: putSchema
      requestBody:
        required: true
        content:
          application/schema+json:
            schema: { type: string }
          application/avro:
            schema: { type: string }
          application/x-protobuf:
            schema: { type: string }
      responses:
        "204":
          description: Stored.
        "400":
          description: Unparseable schema, unknown format, or no registry configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [schemas]
      summary: Fetch a schema
      operationId: getSchema
      responses:
        "200":
          description: The schema body with its content type.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such schema.
    delete:
      tags: [schemas]
      summary: Delete a schema
      operationId: deleteSchema
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such schema.

  /_groups:
    get:
      tags: [groups]
      summary: List every group in the cluster
      operationId: listGroups
      responses:
        "200":
          description: Group names.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /_groups/{group}:
    parameters:
      - $ref: "#/components/parameters/Group"
    get:
      tags: [groups]
      summary: Describe a group
      operationId: describeGroup
      responses:
        "200":
          description: State, generation, and members, from the coordinator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDescription" }
        "404":
          $ref: "#/components/responses/GroupError"
    delete:
      tags: [groups]
      summary: Delete a group and its offsets
      operationId: deleteGroup
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/GroupError"
        "409":
          $ref: "#/components/responses/GroupError"
  /_groups/{group}/members:
    parameters:
      - $ref: "#/components/parameters/Group"
    post:
      tags: [groups]
      summary: Join a group
      description: Returns once the rebalance completes, with the topics assigned to this member.
      operationId: joinGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscription]
              properties:
                subscription:
                  type: array
                  items: { type: string }
                memberId: { type: string }
                instanceId: { type: string }
                clientId: { type: string }
                sessionTimeoutMs: { type: integer, minimum: 1000, maximum: 300000 }
                rebalanceTimeoutMs: { type: integer }
      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memberId: { type: string }
                  generation: { type: integer }
                  assignment:
                    type: array
                    items: { type: string }
                  members:
                    type: array
                    items: { type: string }
        "409":
          $ref: "#/components/responses/GroupError"
        "429":
          $ref: "#/components/responses/GroupError"
  /_groups/{group}/members/{member}:
    parameters:
      - $ref: "#/components/parameters/Group"
      - $ref: "#/components/parameters/Member"
    get:
      tags: [groups]
      summary: A member's current assignment
      operationId: groupAssignment
      parameters:
        - name: generation
          in: query
          required: true
          schema: { type: integer }
        - name: instance_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The assignment at this generation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generation: { type: integer }
                  assignment:
                    type: array
                    items: { type: string }
        "404":
          $ref: "#/components/responses/GroupError"
        "409":
          $ref: "#/components/responses/GroupError"
    delete:
      tags: [groups]
      summary: Leave a group
      operationId: leaveGroup
      parameters:
        - name: instance_id
          in: query
          schema: { type: string }
      responses:
        "204":
          description: Left.
  /_groups/{group}/members/{member}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/Group"
      - $ref: "#/components/parameters/Member"
    post:
      tags: [groups]
      summary: Keep a member alive
      operationId: heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation]
              properties:
                generation: { type: integer }
                instanceId: { type: string }
      responses:
        "204":
          description: Alive.
        "404":
          $ref: "#/components/responses/GroupError"
        "409":
          $ref: "#/components/responses/GroupError"
  /_groups/{group}/offsets:
    parameters:
      - $ref: "#/components/parameters/Group"
    put:
      tags: [groups]
      summary: Commit offsets
      description: Send memberId and generation together to commit as a member.
      operationId: commitOffsets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offsets]
              properties:
                offsets: { $ref: "#/components/schemas/Offsets" }
                memberId: { type: string }
                generation: { type: integer }
                instanceId: { type: string }
      responses:
        "204":
          description: Committed.
        "409":
          $ref: "#/components/responses/GroupError"
    get:
      tags: [groups]
      summary: Fetch committed offsets
      operationId: fetchOffsets
      parameters:
        - name: stream
          in: query
          description: Topics to fetch, repeated. All of them when absent.
          schema:
            type: array
            items: { type: string }
          explode: true
      responses:
        "200":
          description: Committed offsets by topic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offsets: { $ref: "#/components/schemas/Offsets" }

  /health:
    get:
      tags: [admin]
      summary: Liveness
      servers: [{ url: "http://127.0.0.1:9090" }]
      security: []
      responses:
        "200":
          description: The process is up.
  /ready:
    get:
      tags: [admin]
      summary: Readiness
      servers: [{ url: "http://127.0.0.1:9090" }]
      security: []
      responses:
        "200":
          description: Serving and registered in the metadata state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  serving: { type: boolean }
                  registered: { type: boolean }
                  fenced: { type: boolean }
                  appliedIndex: { type: integer }
                  nodeId: { type: integer }
        "503":
          description: Not ready, with the same body. A fenced node is never ready.
  /admin/cluster:
    get:
      tags: [admin]
      summary: Cluster overview
      servers: [{ url: "http://127.0.0.1:9090" }]
      responses:
        "200":
          description: Identity, counts, applied index, lease holder, pending transfers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/nodes:
    get:
      tags: [admin]
      summary: Registered nodes
      servers: [{ url: "http://127.0.0.1:9090" }]
      responses:
        "200":
          description: Every registered node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/streams/{stream}:
    get:
      tags: [admin]
      summary: One partition's placement and state
      servers: [{ url: "http://127.0.0.1:9090" }]
      parameters:
        - $ref: "#/components/parameters/Stream"
        - $ref: "#/components/parameters/Partition"
      responses:
        "200":
          description: Owner, state, epoch, offsets, pending transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamDetail" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: No such stream.
  /admin/transfer:
    post:
      tags: [admin]
      summary: Transfer a partition to another node
      servers: [{ url: "http://127.0.0.1:9090" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream, toNode]
              properties:
                stream: { type: string }
                partition: { type: integer, description: Required for topics with several partitions. }
                toNode: { type: integer }
      responses:
        "202":
          description: Transfer recorded. Completion is asynchronous.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream: { type: string }
                  partition: { type: integer }
                  streamId: { type: integer }
                  toNode: { type: integer }
                  pending: { type: boolean }
        "400":
          description: Invalid target or a conflicting transfer is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/nodes/{id}:
    post:
      tags: [admin]
      summary: Update a node's placement slots
      servers: [{ url: "http://127.0.0.1:9090" }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The updated node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: No such node.
  /admin/tokens:
    get:
      tags: [tokens]
      summary: List tokens
      servers: [{ url: "http://127.0.0.1:9090" }]
      responses:
        "200":
          description: Records visible to the caller. Secrets are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenList" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
    post:
      tags: [tokens]
      summary: Issue a token
      servers: [{ url: "http://127.0.0.1:9090" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueTokenRequest" }
      responses:
        "201":
          description: Issued. The wire token appears once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueTokenResponse" }
        "400":
          description: Invalid id or scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          description: Token id already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
  /admin/tokens/{id}:
    delete:
      tags: [tokens]
      summary: Revoke a token
      servers: [{ url: "http://127.0.0.1:9090" }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: No such token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }
        "409":
          description: Token changed concurrently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    Stream:
      name: stream
      in: path
      required: true
      description: The topic name. Names are paths and may contain slashes.
      schema: { type: string }
    Partition:
      name: partition
      in: query
      description: The partition. Required on topics with several partitions.
      schema: { type: integer, minimum: 0 }
    Group:
      name: group
      in: path
      required: true
      schema: { type: string }
    Member:
      name: member
      in: path
      required: true
      schema: { type: string }
  headers:
    NextSeq:
      description: The partition's next sequence. Pass as `seq` to resume.
      schema: { type: integer }
    Partitions:
      description: The topic's partition count.
      schema: { type: integer }
  responses:
    Unauthenticated:
      description: Missing or invalid credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, enum: [Bearer] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Valid credential, insufficient scope (or producer fencing on append).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The node is stopping or metadata is unreachable. Retry.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GroupError:
      description: >
        unknown_member, not_found, rebalance_in_progress, illegal_generation,
        inconsistent_protocol, conflict, fenced, capacity_exceeded, or
        coordinator_unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminUnauthenticated:
      description: Missing or invalid credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, enum: [Bearer] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
    AdminForbidden:
      description: Valid credential, insufficient scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MessageError" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        next_seq: { type: integer }
    MessageError:
      type: object
      description: Errors on the admin listener and the topic config and schema routes.
      required: [error]
      properties:
        error: { type: string, description: A message. }
    JsonBatch:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            type: object
            required: [body]
            properties:
              body: { type: string }
              headers:
                type: object
                additionalProperties: { type: string }
    ReadPage:
      type: array
      items:
        type: object
        required: [seq, timestamp]
        properties:
          seq: { type: integer }
          timestamp: { type: integer }
          headers:
            type: object
            additionalProperties: { type: string }
          body:
            type: string
            description: Present when the record body is valid UTF-8.
          body_b64:
            type: string
            description: Base64 body, present when the body is not UTF-8.
    StreamList:
      type: object
      properties:
        streams:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              content_type: { type: string }
              partitions: { type: integer }
              start_seq: { type: integer, description: Single-partition topics only. }
              next_seq: { type: integer, description: Single-partition topics only. }
              closed: { type: boolean }
              ttl: { type: integer }
              expires_at: { type: string }
        has_more: { type: boolean }
    Cluster:
      type: object
      properties:
        clusterId: { type: string }
        nodeId: { type: integer }
        nodeEpoch: { type: integer }
        advertisedAddress: { type: string }
        registered: { type: boolean }
        fenced: { type: boolean }
        appliedIndex: { type: integer }
        streamCount: { type: integer }
        objectCount: { type: integer }
        streamSetObjectCount: { type: integer }
        streamObjectCount: { type: integer }
        preparedObjectCount: { type: integer }
        kvEntryCount: { type: integer }
        kvBytes: { type: integer }
        gc:
          type: object
          description: Destroyed-object cleanup backlog.
          properties:
            backlog: { type: integer }
            oldestSeq: { type: [integer, "null"] }
            nextSeq: { type: integer }
        snapshot:
          type: object
          description: Metadata snapshot cycle stats.
          properties:
            lastAppliedIndex: { type: integer }
            lastBytes: { type: integer }
            lastDurationMs: { type: integer }
            lastAtMs: { type: integer }
            taken: { type: integer }
            failed: { type: integer }
        leaseHolder:
          type: [boolean, "null"]
          description: Whether this node holds the maintenance lease. Null when unknown.
        pendingTransfers:
          type: array
          items:
            type: object
            properties:
              streamId: { type: integer }
              fromNode: { type: integer }
              toNode: { type: integer }
    Node:
      type: object
      properties:
        nodeId: { type: integer }
        nodeEpoch: { type: integer }
        advertisedAddress: { type: string }
        slots: { type: integer }
        openingCount: { type: integer }
        placedCount: { type: integer }
        local: { type: boolean }
        fenced: { type: boolean }
    StreamDetail:
      type: object
      properties:
        name: { type: string }
        topicId: { type: string }
        partitions: { type: integer }
        partition: { type: integer }
        streamId: { type: integer }
        ownerNodeId: { type: [integer, "null"] }
        ownerAdvertisedAddress: { type: [string, "null"] }
        ownerLocal: { type: boolean }
        contentType: { type: string }
        kafkaTopic: { type: [string, "null"] }
        ttlSeconds: { type: [integer, "null"] }
        expiresAtMs: { type: [integer, "null"] }
        closed: { type: boolean }
        state:
          type: [string, "null"]
          description: opened or closed. Null before first open.
        epoch: { type: [integer, "null"] }
        nodeId:
          type: [integer, "null"]
          description: Node in the placement row, may lag the effective owner during a transfer.
        startOffset: { type: [integer, "null"] }
        endOffset: { type: [integer, "null"] }
        pendingTransfer:
          type: [object, "null"]
          properties:
            fromNode: { type: integer }
            toNode: { type: integer }
    ResourceMatcher:
      type: object
      oneOf:
        - required: [exact]
          properties:
            exact: { type: string }
        - required: [prefix]
          properties:
            prefix: { type: string }
    ReadWrite:
      type: object
      properties:
        read: { type: boolean }
        write: { type: boolean }
    Scope:
      type: object
      properties:
        streams:
          type: array
          items: { $ref: "#/components/schemas/ResourceMatcher" }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/ResourceMatcher" }
        groups:
          type: object
          properties:
            stream: { $ref: "#/components/schemas/ReadWrite" }
            tokens: { $ref: "#/components/schemas/ReadWrite" }
            admin: { $ref: "#/components/schemas/ReadWrite" }
        ops:
          type: array
          items:
            type: string
            enum:
              [
                read,
                head,
                list,
                create,
                append,
                trim,
                close,
                delete,
                issue_token,
                revoke_token,
                list_tokens,
                cluster_read,
                node_read,
                stream_inspect,
                transfer_stream,
                update_node_slots,
                delete_group,
              ]
        audiences:
          type: array
          items: { type: string, enum: [pico, durable_streams, admin] }
        autoPrefixStreams: { type: boolean }
        expiresAtMs: { type: [integer, "null"] }
    TokenRecord:
      type: object
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/Scope" }
        createdAtMs: { type: integer }
        issuedBy: { type: string }
    TokenList:
      type: object
      properties:
        count: { type: integer }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/TokenRecord" }
    IssueTokenRequest:
      type: object
      required: [id, scope]
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/Scope" }
    IssueTokenResponse:
      type: object
      properties:
        id: { type: string }
        token: { type: string }
        scope: { $ref: "#/components/schemas/Scope" }
        createdAtMs: { type: integer }
    TopicConfig:
      type: object
      properties:
        schema: { type: [string, "null"] }
        schemaValidate: { type: boolean }
        partitions: { type: integer, minimum: 1 }
        kafkaTopic: { type: [string, "null"], description: Follows from the name. Read only. }
        retentionMs: { type: [integer, "null"], minimum: 1, description: Null when unlimited. }
        retentionBytes: { type: [integer, "null"], minimum: 1, description: Null when unlimited. }
    Offsets:
      type: object
      additionalProperties:
        type: object
        required: [position]
        properties:
          position: { type: integer }
          metadata: { type: [string, "null"] }
    GroupDescription:
      type: object
      properties:
        group: { type: string }
        state: { type: string }
        generation: { type: integer }
        protocolType: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              memberId: { type: string }
              instanceId: { type: [string, "null"] }
              clientId: { type: string }
              subscription:
                type: array
                items: { type: string }
              assignment:
                type: array
                items: { type: string }
