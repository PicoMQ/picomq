openapi: 3.1.0
info:
  title: PicoMQ HTTP API
  version: 0.1.0
  description: >
    The Pico protocol, PicoMQ's native HTTP API, plus the admin API served by
    each node's admin listener. A stream is addressed by its path. Requests for
    a stream owned by another node return 307 with the owner's address. With
    auth required, send `Authorization: Bearer <token>` (probes stay open).
servers:
  - url: http://127.0.0.1:4437
    description: Protocol listener

tags:
  - name: streams
    description: The Pico protocol.
  - name: schemas
    description: Schema registry on the protocol listener.
  - name: stream-config
    description: Protocol-neutral stream config on the protocol listener.
  - name: admin
    description: Admin listener endpoints (default port 9090).
  - name: tokens
    description: Token control plane on the admin listener.

security:
  - BearerAuth: []

paths:
  /:
    get:
      tags: [streams]
      summary: List streams
      operationId: listStreams
      parameters:
        - name: prefix
          in: query
          description: Name prefix to filter by.
          schema: { type: string, default: "/" }
        - name: start_after
          in: query
          description: Continue after this name from the previous page.
          schema: { type: string }
        - name: limit
          in: query
          description: Page size cap.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Streams under the prefix.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamList" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /{stream}:
    parameters:
      - $ref: "#/components/parameters/Stream"
    put:
      tags: [streams]
      summary: Create a stream
      description: >
        Idempotent. A request body is appended as the first records. Stream
        names may contain slashes, the whole path is the name.
      operationId: createStream
      parameters:
        - name: Content-Type
          in: header
          description: Stored as the stream's content type.
          schema: { type: string, default: application/octet-stream }
        - name: Pico-TTL
          in: header
          description: Retention in seconds.
          schema: { type: integer, minimum: 0 }
        - name: Pico-Expires-At
          in: header
          description: Absolute expiry time (RFC 3339 or unix ms).
          schema: { type: string }
        - name: Pico-Closed
          in: header
          description: Create the stream already sealed.
          schema: { type: boolean }
        - name: Pico-Schema
          in: header
          description: Bind a registered schema by name.
          schema: { type: string }
        - name: Pico-Schema-Validate
          in: header
          description: Validate appends against the bound schema. Defaults to false.
          schema: { type: boolean }
      requestBody:
        description: Optional initial records.
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Created.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
        "200":
          description: Already exists with the same content type.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Exists with a different content type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [streams]
      summary: Append records, or trim
      description: >
        The body is one record in the stream's content type, a JSON batch, or a
        binary batch. With Pico-Trim-Seq set the request is a trim instead and
        takes no body.
      operationId: appendRecords
      parameters:
        - name: Pico-Producer-Id
          in: header
          description: Idempotent producer identity.
          schema: { type: string }
        - name: Pico-Producer-Epoch
          in: header
          schema: { type: integer, minimum: 0 }
        - name: Pico-Producer-Seq
          in: header
          description: Per-producer sequence, accepted exactly once.
          schema: { type: integer, minimum: 0 }
        - name: Pico-Match-Seq
          in: header
          description: Conditional append, succeeds only at this tail sequence.
          schema: { type: integer, minimum: 0 }
        - name: Pico-Closed
          in: header
          description: Seal the stream after this append.
          schema: { type: boolean }
        - name: Pico-Trim-Seq
          in: header
          description: Trim records below this sequence instead of appending.
          schema: { type: integer, minimum: 0 }
      requestBody:
        content:
          "*/*":
            schema: { type: string, format: binary }
          application/vnd.picomq.batch+json:
            schema: { $ref: "#/components/schemas/JsonBatch" }
          application/vnd.picomq.batch:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Appended, or trimmed.
          headers:
            Pico-Start-Seq:
              description: Sequence of the first appended record, or the new start after a trim.
              schema: { type: integer }
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Timestamp:
              description: Timestamp assigned to the records.
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Producer conflict or sealed stream.
          headers:
            Pico-Expected-Seq:
              description: The producer sequence the server expected next.
              schema: { type: integer }
            Pico-Received-Seq:
              description: The sequence the server received.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [streams]
      summary: Read records
      operationId: readRecords
      parameters:
        - name: seq
          in: query
          description: Start position, a number or `now`. Defaults to 0.
          schema: { type: string }
        - name: count
          in: query
          description: Max records returned.
          schema: { type: integer, minimum: 0 }
        - name: bytes
          in: query
          description: Max bytes returned.
          schema: { type: integer, minimum: 0 }
        - name: format
          in: query
          schema: { type: string, enum: [json, binary, raw], default: json }
        - name: live
          in: query
          description: Wait for data instead of returning immediately.
          schema: { type: string, enum: [long-poll, sse] }
        - name: Last-Event-ID
          in: header
          description: SSE reconnect position, used when `seq` is absent.
          schema: { type: string }
        - name: If-None-Match
          in: header
          description: Catch-up reads honor the previous ETag with 304.
          schema: { type: string }
      responses:
        "200":
          description: Records from `seq`.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Up-To-Date:
              description: Present when the response reaches the tail.
              schema: { type: boolean }
            Pico-Closed:
              description: Present when the stream is sealed and fully read.
              schema: { type: boolean }
            Pico-Cursor:
              description: Opaque resume token for paginated catch-up reads.
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadPage" }
            application/vnd.picomq.batch:
              schema: { type: string, format: binary }
            text/event-stream:
              schema: { type: string }
        "204":
          description: Long poll timed out with no new records.
        "304":
          description: Nothing new since the ETag in If-None-Match.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    head:
      tags: [streams]
      summary: Stream metadata
      operationId: headStream
      responses:
        "200":
          description: Metadata in headers, no body.
          headers:
            Pico-Next-Seq: { $ref: "#/components/headers/NextSeq" }
            Pico-Start-Seq:
              schema: { type: integer }
            Pico-TTL:
              schema: { type: integer }
            Pico-Expires-At:
              schema: { type: string }
            Pico-Closed:
              schema: { type: boolean }
            Pico-Schema:
              description: The bound schema name, present when bound.
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such stream.
    delete:
      tags: [streams]
      summary: Delete a stream
      operationId: deleteStream
      responses:
        "204":
          description: Deleted. The name is immediately reusable.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such stream.

  /_streams/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The stream path without requiring a leading slash. Topic `orders` is `/orders`.
        schema: { type: string }
    get:
      tags: [stream-config]
      summary: Read stream schema config
      operationId: getStreamConfig
      responses:
        "200":
          description: Current schema bind and validation flag.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema: { type: string, nullable: true }
                  schemaValidate: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such stream.
    patch:
      tags: [stream-config]
      summary: Update stream schema config
      operationId: patchStreamConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schema: { type: string, nullable: true }
                schemaValidate: { type: boolean }
      responses:
        "200":
          description: Updated config.
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema: { type: string, nullable: true }
                  schemaValidate: { type: boolean }
        "400":
          description: Empty patch, unknown schema, or invalid body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such stream.

  /_schemas/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The schema name. Names are paths and may contain slashes.
        schema: { type: string }
    put:
      tags: [schemas]
      summary: Register a schema
      description: >
        Store or replace a schema. The format comes from the Content-Type, or
        from an extension on the name. 400 when the schema does not parse or
        the node runs without a schema registry.
      operationId: putSchema
      requestBody:
        required: true
        content:
          application/schema+json:
            schema: { type: string }
          application/avro:
            schema: { type: string }
          application/x-protobuf:
            schema: { type: string }
      responses:
        "204":
          description: Stored.
        "400":
          description: Unparseable schema, unknown format, or no registry configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [schemas]
      summary: Fetch a schema
      operationId: getSchema
      responses:
        "200":
          description: The schema body with its content type.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such schema.
    delete:
      tags: [schemas]
      summary: Delete a schema
      operationId: deleteSchema
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such schema.

  /health:
    get:
      tags: [admin]
      summary: Liveness
      servers: [{ url: "http://127.0.0.1:9090" }]
      security: []
      responses:
        "200":
          description: The process is up.
  /ready:
    get:
      tags: [admin]
      summary: Readiness
      servers: [{ url: "http://127.0.0.1:9090" }]
      security: []
      responses:
        "200":
          description: Serving and registered in the metadata state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  serving: { type: boolean }
                  registered: { type: boolean }
                  appliedIndex: { type: integer }
                  nodeId: { type: integer }
        "503":
          description: Not ready.
  /admin/cluster:
    get:
      tags: [admin]
      summary: Cluster overview
      servers: [{ url: "http://127.0.0.1:9090" }]
      responses:
        "200":
          description: Identity, counts, applied index, lease holder, pending transfers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cluster" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/nodes:
    get:
      tags: [admin]
      summary: Registered nodes
      servers: [{ url: "http://127.0.0.1:9090" }]
      responses:
        "200":
          description: Every registered node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/streams/{stream}:
    get:
      tags: [admin]
      summary: One stream's placement and state
      servers: [{ url: "http://127.0.0.1:9090" }]
      parameters:
        - $ref: "#/components/parameters/Stream"
      responses:
        "200":
          description: Owner, state, epoch, offsets, pending transfer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamDetail" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: No such stream.
  /admin/transfer:
    post:
      tags: [admin]
      summary: Transfer a stream to another node
      servers: [{ url: "http://127.0.0.1:9090" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream, toNode]
              properties:
                stream: { type: string }
                toNode: { type: integer }
      responses:
        "200":
          description: Transfer recorded. Completion is asynchronous.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream: { type: string }
                  streamId: { type: integer }
                  toNode: { type: integer }
                  pending: { type: boolean }
        "400":
          description: Invalid target or a conflicting transfer is pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
  /admin/nodes/{id}:
    post:
      tags: [admin]
      summary: Update a node's placement slots
      servers: [{ url: "http://127.0.0.1:9090" }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The updated node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: No such node.
  /admin/tokens:
    get:
      tags: [tokens]
      summary: List tokens
      servers: [{ url: "http://127.0.0.1:9090" }]
      responses:
        "200":
          description: Records visible to the caller. Secrets are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenList" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
    post:
      tags: [tokens]
      summary: Issue a token
      servers: [{ url: "http://127.0.0.1:9090" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueTokenRequest" }
      responses:
        "201":
          description: Issued. The wire token appears once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssueTokenResponse" }
        "400":
          description: Invalid id or scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminError" }
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          description: Token id already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminError" }
  /admin/tokens/{id}:
    delete:
      tags: [tokens]
      summary: Revoke a token
      servers: [{ url: "http://127.0.0.1:9090" }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/AdminUnauthenticated"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          description: No such token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminError" }
        "409":
          description: Token changed concurrently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminError" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    Stream:
      name: stream
      in: path
      required: true
      description: The stream name. Names are paths and may contain slashes.
      schema: { type: string }
  headers:
    NextSeq:
      description: The stream's next sequence. Pass as `seq` to resume.
      schema: { type: integer }
  responses:
    Unauthenticated:
      description: Missing or invalid credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, enum: [Bearer] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Valid credential, insufficient scope (or producer fencing on append).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminUnauthenticated:
      description: Missing or invalid credential.
      headers:
        WWW-Authenticate:
          schema: { type: string, enum: [Bearer] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminError" }
    AdminForbidden:
      description: Valid credential, insufficient scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminError" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        message: { type: string }
        next_seq: { type: integer }
    AdminError:
      type: object
      required: [error]
      properties:
        error: { type: string }
    JsonBatch:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            type: object
            required: [body]
            properties:
              body: { type: string }
              headers:
                type: object
                additionalProperties: { type: string }
    ReadPage:
      type: array
      items:
        type: object
        required: [seq, timestamp]
        properties:
          seq: { type: integer }
          timestamp: { type: integer }
          headers:
            type: object
            additionalProperties: { type: string }
          body:
            type: string
            description: Present when the record body is valid UTF-8.
          body_b64:
            type: string
            description: Base64 body, present when the body is not UTF-8.
    StreamList:
      type: object
      properties:
        streams:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              content_type: { type: string }
              start_seq: { type: integer }
              next_seq: { type: integer }
              closed: { type: boolean }
              ttl: { type: integer }
              expires_at: { type: string }
        has_more: { type: boolean }
    Cluster:
      type: object
      properties:
        clusterId: { type: string }
        nodeId: { type: integer }
        nodeEpoch: { type: integer }
        advertisedAddress: { type: string }
        registered: { type: boolean }
        appliedIndex: { type: integer }
        streamCount: { type: integer }
        objectCount: { type: integer }
        streamSetObjectCount: { type: integer }
        streamObjectCount: { type: integer }
        preparedObjectCount: { type: integer }
        kvEntryCount: { type: integer }
        kvBytes: { type: integer }
        gc:
          type: object
          description: Destroyed-object cleanup backlog.
          properties:
            backlog: { type: integer }
            oldestSeq: { type: [integer, "null"] }
            nextSeq: { type: integer }
        snapshot:
          type: object
          description: Metadata snapshot cycle stats.
          properties:
            lastAppliedIndex: { type: integer }
            lastBytes: { type: integer }
            lastDurationMs: { type: integer }
            lastAtMs: { type: integer }
            taken: { type: integer }
            failed: { type: integer }
        leaseHolder:
          type: [boolean, "null"]
          description: Whether this node holds the maintenance lease. Null when unknown.
        pendingTransfers:
          type: array
          items:
            type: object
            properties:
              streamId: { type: integer }
              fromNode: { type: integer }
              toNode: { type: integer }
    Node:
      type: object
      properties:
        nodeId: { type: integer }
        nodeEpoch: { type: integer }
        advertisedAddress: { type: string }
        slots: { type: integer }
        openingCount: { type: integer }
        placedCount: { type: integer }
        local: { type: boolean }
    StreamDetail:
      type: object
      properties:
        name: { type: string }
        streamId: { type: integer }
        ownerNodeId: { type: [integer, "null"] }
        ownerAdvertisedAddress: { type: [string, "null"] }
        ownerLocal: { type: boolean }
        contentType: { type: string }
        ttlSeconds: { type: [integer, "null"] }
        expiresAtMs: { type: [integer, "null"] }
        closed: { type: boolean }
        state:
          type: [string, "null"]
          description: Placement state, opening or placed. Null before first open.
        epoch: { type: [integer, "null"] }
        nodeId:
          type: [integer, "null"]
          description: Node in the placement row, may lag the effective owner during a transfer.
        startOffset: { type: [integer, "null"] }
        endOffset: { type: [integer, "null"] }
        pendingTransfer:
          type: [object, "null"]
          properties:
            fromNode: { type: integer }
            toNode: { type: integer }
    ResourceMatcher:
      type: object
      oneOf:
        - required: [exact]
          properties:
            exact: { type: string }
        - required: [prefix]
          properties:
            prefix: { type: string }
    ReadWrite:
      type: object
      properties:
        read: { type: boolean }
        write: { type: boolean }
    Scope:
      type: object
      properties:
        streams:
          type: array
          items: { $ref: "#/components/schemas/ResourceMatcher" }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/ResourceMatcher" }
        groups:
          type: object
          properties:
            stream: { $ref: "#/components/schemas/ReadWrite" }
            tokens: { $ref: "#/components/schemas/ReadWrite" }
            admin: { $ref: "#/components/schemas/ReadWrite" }
        ops:
          type: array
          items:
            type: string
            enum:
              [
                read,
                head,
                list,
                create,
                append,
                trim,
                close,
                delete,
                issue_token,
                revoke_token,
                list_tokens,
                cluster_read,
                node_read,
                stream_inspect,
                transfer_stream,
                update_node_slots,
              ]
        audiences:
          type: array
          items: { type: string, enum: [pico, durable_streams, admin] }
